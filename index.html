/* --- PDF → paragraphs (uses item positions to find breaks, headings and repeated headers) --- */
// One page of a PDF as text lines with positions (PDF units, y grows upwards)
async function pdfPageLines(page){
  const tc = await page.getTextContent(), ph = (page.view && page.view[3]) || 842, pw = (page.view && page.view[2]) || 595;
  const lines = []; let cur = null;
  for (const it of tc.items){
    if (!('str' in it)) continue;
    const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 10;
    if (cur && Math.abs(y - cur.y) < h * 0.6 && x >= cur.xEnd - h * 0.5 && x - cur.xEnd < h * 1.2){   // same line, same column
      const gap = x - cur.xEnd;
      if (gap > h * 0.15 && !/\s$/.test(cur.text) && !/^\s/.test(it.str)) cur.text += ' ';
      cur.text += it.str; cur.xEnd = Math.max(cur.xEnd, x + (it.width || 0));
    } else if (it.str.trim()){
      if (cur) lines.push(cur);
      cur = {text:it.str, x, y, h, xEnd:x + (it.width || 0)};
    }
    if (it.hasEOL && cur){ lines.push(cur); cur = null; }
  }
  if (cur) lines.push(cur);
  lines.forEach(l => { l.text = l.text.replace(/\s+/g, ' ').trim(); l.w = l.xEnd - l.x; });
  const byY = lines.filter(l => l.text).sort((a,b) => b.y - a.y);      // only the outermost lines can be headers / footers
  [...byY.slice(0, 2), ...byY.slice(-2)].forEach(l => { l.edge = l.y > ph * 0.9 || l.y < ph * 0.1; });
  return {lines:lines.filter(l => l.text), W:pw, H:ph};
}

async function vocalizeParas(paper, list){

      const b = list.slice(i, i + 4);
      const items = await AI.json(`Add full Arabic diacritics (tashkeel: fatha, damma, kasra, sukun, shadda and tanween, with correct case endings) to each Modern Standard Arabic paragraph below, so that a text-to-speech voice pronounces it correctly.

${b.map(p => `[${p.id}]\n${p.ar}`).join('\n\n')}

Reply with only a JSON array, one object per paragraph in the same order: [{"id":"p3","voc":"..."}]`, {signal:ctl.signal, modelTier:'default'});
      const got = Array.isArray(items) ? items : items && typeof items === 'object' ? (Object.values(items).find(Array.isArray) || (items.voc ? [items] : [])) : [];

        const p = b.find(x => x.id === String(it && it.id)) || (b.length === 1 ? b[0] : null), voc = String((it && it.voc) || '');

        if (vocMap(p.ar, voc)){ p.arVoc = {for:textHash(p.ar), text:voc}; ok++; } else bad++;

function readingNotes(paper){
  const L = [`READING NOTES — ${paper.title || paper.name}`, '='.repeat(50)];
  if (paper.questions && paper.questions.overview) L.push('', 'IN A NUTSHELL', paper.questions.overview);
  let last = null;
  paper.paras.filter(p => p.kind !== 'front').forEach(p => {
    if (p.section !== last){ L.push('', p.section.toUpperCase()); last = p.section; }
    if (isFigure(p)){ L.push(`[${p.label || 'Figure'}${p.page ? ` (p. ${p.page})` : ''}: ${clip(p.caption || p.text, 120)} — explained in Figure Lab]`); return; }
    const to = p.link.to && paper.paras.find(x => x.id === p.link.to);
    L.push(`¶${paraNo(paper, p.id)}${p.page ? ` (p. ${p.page})` : ''}: ${ideaOf(p) || '—'}${to ? `  [${relLabel(p.link.rel) || 'linked to'} ¶${paraNo(paper, to.id)}]` : ''}`);
    if (p.mine) L.push(`   Memory hook: ${p.mine}`);
    if ((p.notes || '').trim()) L.push(`   My notes: ${p.notes.trim().replace(/\n+/g, ' / ')}`);
    if ((p.concepts || []).length) L.push(`   Important concepts: ${p.concepts.join(', ')}`);
    (p.terms||[]).forEach(t => L.push(`   • ${t.term}: ${t.meaning}`));
  });
  return L.join('\n');
}

/* --- Generated paragraph --- */
const lcFirst = s => s && /^(the|this|these|that|those|a|an|all|both|each|every|most|many|some|it|its|there|their|our|we|they|accuracy|performance|students|participants|results?)\b/i.test(s) && !/^[A-Z]{2,}/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
const trimDot = s => (s || '').trim().replace(/[.;\s]+$/, '');
const listJoin = a => a.length < 2 ? a.join('') : a.slice(0,-1).join(', ') + ' and ' + a[a.length-1];
const figWord = no => { const t = (no || '').trim(); return /^fig\.?\s*/i.test(t) ? t.replace(/^fig\.?\s*/i, 'Figure ') : t || 'This figure'; };
// "Reports error rates…" / "The figure reports…" → "reports error rates…" (keeps names such as "Model B")
function phraseList(text, noun){
  return (text || '').split('\n').map(l => trimDot(l.replace(/^[-•*]\s*/, '').replace(new RegExp(`^(the (${noun}|figure|table)|it)\\s+`, 'i'), '')))
    .filter(Boolean).map(l => /^[A-Z][a-z]+\b/.test(l) && !/^[A-Z][a-z]+\s+[A-Z0-9]/.test(l) ? l.charAt(0).toLowerCase() + l.slice(1) : l);
}
// The checklist only feeds weaknesses once someone has used it (a new review has nothing ticked yet)
const checklistUsed = r => !!(r.ai || r.example || Object.entries(r.checks || {}).some(([k, v]) => k !== 'ref' && v !== undefined));
function figParagraph(r){
  fixFig(r);
  const t = figType(r.type), L = [], label = figWord(r.figNo);
  const tn = t ? t.name : 'figure';
  L.push(`${label} is ${/^[aeiou]/i.test(tn) ? 'an' : 'a'} ${tn}${r.caption.trim() ? ` captioned “${trimDot(r.caption)}”` : ''}.`);
  if (t && t.axis === 'xy' && (r.x.trim() || r.y.trim())){
    if (t.k === 'heatmap') L.push([r.x.trim() && `Its rows show ${trimDot(r.x)}`, r.y.trim() && `its columns show ${trimDot(r.y)}`].filter(Boolean).join(' and ').replace(/^its/, 'Its') + '.');
    else L.push([r.x.trim() && `The x-axis shows ${trimDot(r.x)}`, r.y.trim() && `the y-axis shows ${trimDot(r.y)}`].filter(Boolean).join(' and ').replace(/^the/, 'The') + '.');
  } else if (t && t.axis === 'single' && r.single.trim()) L.push(`${t.axisLead} ${trimDot(r.single)}.`);
  if (r.pattern.trim()) L.push(`The main finding is that ${lcFirst(trimDot(r.pattern).replace(/^that\s+/i, ''))}.`);
  const claim = trimDot(r.claim).replace(/^that\s+/i, '');
  if (r.support && claim) L.push({full:`This fully supports the authors’ claim that ${lcFirst(claim)}.`, partial:`This partially supports the authors’ claim that ${lcFirst(claim)}.`, none:`However, it does not support the authors’ claim that ${lcFirst(claim)}.`}[r.support]);
  else if (r.support) L.push({full:'It fully supports the related claim in the text.', partial:'It only partially supports the related claim in the text.', none:'It does not support the related claim in the text.'}[r.support]);
  if (r.supportWhy.trim()) L.push(trimDot(r.supportWhy) + '.');
  ['relation', 'importance', 'effect'].forEach(k => { if ((r[k] || '').trim()) L.push(trimDot(r[k]) + '.'); });
  const noun = t && t.k === 'table' ? 'table' : 'figure';
  const strengths = phraseList(r.strengths, noun);
  if (strengths.length) L.push(`On the positive side, the ${noun} ${listJoin(strengths)}.`);
  const weak = [...phraseList(r.weaknesses, noun), ...(checklistUsed(r) ? FIG_CHECKS.filter(([k]) => r.checks[k] === false || r.checks[k] === undefined).map(c => c[2]) : [])];
  const flags = t ? t.flags.filter((_,i) => r.flags[i]).map(f => f[1]) : [];
  if (weak.length) L.push(`${r.support === 'none' ? 'In addition' : 'However'}, the ${noun} ${listJoin(weak)}.`);
  if (flags.length) L.push(`${weak.length ? 'Moreover' : 'However'}, ${listJoin(flags)}.`);
  if (!weak.length && !flags.length && r.type) L.push(`The ${noun} meets all the quality checks applied in this review.`);
  const rated = FIG_RATINGS.filter(([k]) => r.ratings[k]);
  if (rated.length) L.push(`Overall, I rate it ${listJoin(rated.map(([k,l]) => `${r.ratings[k]}/5 for ${l.toLowerCase().replace(' / ', ' and ')}`))}.`);
  return L.join(' ');
}

  return `<div class="sec-head"><span class="sec-num">3</span><h3>How to read a ${esc(t.n.toLowerCase())}</h3></div>
    <div class="grid g-2"><div><h4>Steps</h4><ol class="steps">${t.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>

function axesFields(r, t){

  const xq = t && t.xQ ? t.xQ : 'x-axis — what and in which units?', yq = t && t.yQ ? t.yQ : 'y-axis — what and in which units?';
  return `<span class="f" style="display:block;margin-bottom:6px">What is on each axis, with units?</span><div class="fields-2">
    <div class="field"><label class="f small muted" for="fl-x">${esc(xq)}</label><input class="input" id="fl-x" data-fl="x" value="${esc(r.x)}" placeholder="e.g. training set size (number of essays)"></div>

}

}

function updateBuild(){

/* ---------- 5. Presentation Builder ---------- */
function presSources(){
  return [
    ...S.critiques.map(c => ({id:'crit:'+c.id, label:`Critique: ${c.example?'[Example] ':''}${c.form==='aau'?'AAU · ':''}${clip(critTitle(c)||'Untitled',60)}${critDone(c)?' ✓':''}`})),
    {id:'paper', label:`My paper outline: ${clip(S.writing.title||'Untitled', 60)}`},
    ...(S.pres.upload ? [{id:'upload', label:`Added critique: ${clip(S.pres.upload.name, 60)}`}] : [])
  ];
}
function figBullets(c){
  const figs = S.figlab.reviews.filter(r => r.critId === c.id && (r.figNo || r.pattern));
  return figs.slice(0, 2).map(r => `Show ${r.figNo || 'figure'}: ${clip(trimDot(r.pattern) || r.caption || '', 90)}`);
}
function bullets(text, n=3, fallback){
  const s = sentences(text).slice(0, n).map(x => clip(x, 160));
  return s.length ? s : [fallback];
}
function buildSlides(){
  const src = S.pres.source || '';
  if (src.startsWith('crit:')){
    const c = S.critiques.find(x => 'crit:'+x.id === src);
    if (c && c.form === 'aau'){
      const t = k => aauText(c, k), i = c.info;
      const need = l => `[Add your ${l} in the Critique Studio]`;
      return {
        title:{h:i.title||'Paper title', b:[[i.authors, i.year].filter(Boolean).join(', ') || 'Authors, year', i.venue || 'Venue', `Critique by: ${i.studentName || '[your name]'}${i.presNo ? ` · Presentation ${i.presNo}` : ''}`]},
        background:{b:bullets(t('summary'), 2, need('summary'))},
        problem:{b:[...bullets(t('problem'), 2, need('research problem & objectives')), ...bullets(t('litreview'), 1, need('literature review'))]},
        method:{b:bullets(t('method'), 3, need('methodology critique'))},
        findings:{b:[...bullets(t('results'), 3, need('results & discussion')), ...figBullets(c)]},
        critique:{b:[...bullets(t('strengths'), 2, need('strengths')).map(x => 'Strength: ' + x), ...bullets(t('weaknesses'), 2, need('weaknesses')).map(x => 'Weakness: ' + x)]},
        conclusion:{b:[...bullets(t('contribution'), 2, need('contribution')), ...bullets(t('future'), 1, need('future work')).map(x => 'Future work: ' + x),
          ...(AAU_A.some(a => (c.partA[a.k]||{}).score) ? ['Diagnostic ratings: ' + AAU_A.filter(a => (c.partA[a.k]||{}).score).map(a => `${a.t} ${c.partA[a.k].score}/${a.max}`).join(' · ')] : [])]},
        qa:{b:['Thank you — questions?','Prepare: How far do the findings generalise beyond this setting?','Prepare: Which of the weaknesses matters most, and why?']}
      };
    }
    if (c){
      const sec = k => (c.sections[k]||{}).text || '';
      const r = k => (c.sections[k]||{}).rating;
      const ph = k => `[Add your ${CRIT_SECTIONS.find(s=>s.key===k).title.toLowerCase()} notes in the Critique Studio]`;
      const rated = CRIT_SECTIONS.filter(s => r(s.key) && s.key!=='verdict');
      const strengths = rated.filter(s => r(s.key) >= 4).map(s => `${s.title} (${r(s.key)}/5)`);
      const weaknesses = rated.filter(s => r(s.key) <= 3).map(s => `${s.title} (${r(s.key)}/5)`);
      const ci = c.citation;
      return {
        title:{h:ci.title||'Paper title', b:[[ci.authors, ci.year].filter(Boolean).join(', ') || 'Authors, year', ci.venue || 'Venue', 'A critical review by: [your name]']},
        background:{b:bullets(sec('citation') || sec('problem'), 2, ph('problem'))},
        problem:{b:[...bullets(sec('problem'), 2, ph('problem')), ...bullets(sec('objectives'), 1, ph('objectives'))]},
        method:{b:[...bullets(sec('methodology'), 2, ph('methodology')), ...bullets(sec('dataset'), 1, ph('dataset'))]},
        findings:{b:[...bullets(sec('results'), 3, ph('results')), ...figBullets(c)]},
        critique:{b:[
          'Strengths: ' + (strengths.join(', ') || 'rate sections 4–5 to list them'),
          'Weaknesses: ' + (weaknesses.join(', ') || 'rate sections 1–3 to list them'),
          ...bullets(sec('limitations'), 1, ph('limitations')),
          ...(sec('ethics') ? bullets(sec('ethics'), 1, '') : [])
        ]},
        conclusion:{b:[...bullets(sec('verdict'), 2, ph('verdict')), ...bullets(sec('contribution'), 1, ph('contribution')),
          ...(c.recommendation ? [`Recommendation: ${c.recommendation}${critAvg(c) ? ` — overall ${critAvg(c).toFixed(1)}/5` : ''}`] : [])]},
        qa:{b:['Thank you — questions?','Prepare: Would the results hold with a different sample?','Prepare: How could this study be improved or extended?']}
      };
    }
  }
  const n = k => stepState(k).notes;
  const ph = k => `[Add notes to "${WRITE_STEPS.find(s=>s.key===k).title}" in Write Your Paper]`;
  return {
    title:{h:S.writing.title||'Your paper title', b:['[Your name], [Institution]','[Course / conference], [date]']},
    background:{b:bullets(n('topic') + ' ' + n('litreview'), 3, ph('litreview'))},
    problem:{b:[...bullets(n('gap'), 2, ph('gap')), ...bullets(n('question'), 1, ph('question'))]},
    method:{b:bullets(n('methodology'), 3, ph('methodology'))},
    findings:{b:bullets(n('results'), 3, ph('results'))},
    critique:{h:'Strengths & limitations of my study', b:bullets(n('discussion'), 3, ph('discussion'))},
    conclusion:{b:bullets(n('conclusion') || n('abstract'), 3, ph('conclusion'))},
    qa:{b:['Thank you — questions?','Contact: [email]','Prepare: What would you do differently with more time?']}
  };
}

/* --- running with Claude (in small parts, so long critiques fit) --- */
let dRun = null;
const D_FATAL = ['rate_limited', 'session_expired', 'not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
async function dRunStages(set, stages, only){
  if (!aiReady()) return toast('Claude writes the questions on the published ScholarPath page — you can copy the prompt into a Claude chat instead');
  if (dRun || vRun || aiRun) return toast('Claude is still working — please wait or press Stop');
  if (!set.docs.paper) return alert('Add the original research paper first — every question and answer is checked against it.');
  if (!set.docs.critique) return alert('Add your written critique — the questions are written for its actual sections.');
  if (stages.includes('slides') && !set.docs.pres && stages.length === 1) return alert('Add your presentation first.');
  const ctl = new AbortController(), errors = [];
  dRun = {ctl, label:'', i:0}; let ran = 0;
  const one = async (stage, arg, label) => {
    if (ctl.signal.aborted) return false;
    dRun.i++; dRun.label = label; dRenderRun();
    try { dApply(set, stage, await AI.json(dPrompt(set, stage, arg), {signal:ctl.signal, modelTier:(D_STAGES.find(s => s.k === stage) || {}).tier || 'default', cache:false}), arg); ran++; save(); dRefreshBody(); return true; }
    catch (e){
      if (e && e.code === 'cancelled'){ ctl.abort(); return false; }
      errors.push(`${label}: ${aiError(e)}`);
      if (e && D_FATAL.includes(e.code)) ctl.abort();
      return false;
    }
  };
  try {
    for (const k of stages){
      if (ctl.signal.aborted) break;
      if (k === 'analyse' || !dStageCur(set, 'analyse')){                 // every question is written from a current analysis
        if (!(await one('analyse', null, 'Analysing the paper, critique and slides'))) break;
        if (k === 'analyse') continue;
      }
      if (k === 'sections'){
        const secs = dSecs(set).filter(s => !only || only.includes(s.heading));
        for (let i = 0; i < secs.length; i += 2) await one('sections', secs.slice(i, i + 2), `Questions for ${secs.slice(i, i + 2).map(s => `“${clip(s.heading, 40)}”`).join(' and ')} (${Math.min(i + 2, secs.length)} of ${secs.length} sections)`);
      }
      if (k === 'challenge') await one('challenge', null, 'Challenging your strengths, weaknesses and recommendations');
      if (k === 'slides' && set.docs.pres){
        const locs = dSlideLocs(set);
        for (let i = 0; i < locs.length; i += 8) await one('slides', locs.slice(i, i + 8), `Questions for ${locs[i]}–${locs[Math.min(i + 7, locs.length - 1)]}`);
      }
    }
  } finally {
    dRun = null; save(); if (S.ui.tab === 'defend') RENDER.defend();
  }
  if (errors.length) alert('Some parts did not finish:\n\n' + errors.join('\n'));
  else if (ran) toast('Questions ready — written by Claude: check each answer against the paper');
}
function dRenderRun(){
  const el = $('#dRun'); if (!el) return;
  el.innerHTML = dRun ? `<div class="ai-run"><span class="spin" aria-hidden="true"></span><span>Claude is working: <b>${esc(dRun.label)}</b> <span class="muted small">(each part can take a minute or two; what is finished is saved)</span></span><button class="btn sm" data-act="d-stop">${icon('stop')}Stop</button></div>` : '';

}

/* --- the mock professor: one question at a time, your answer, then feedback --- */
function dEvalPrompt(set, q, question, model, answer, isFollow){
  return dHead(set, {paper:60000, critique:25000, pres:12000}) + `YOUR TASK: you are now the student's professor in an ORAL EXAMINATION about their critique. Evaluate the student's answer fairly and constructively. Judge it against the ORIGINAL PAPER (the source of truth), not only against the model answer. Never invent evidence.

QUESTION${isFollow ? ' (a follow-up)' : ''}: ${question}
What it tests: ${q.means || '—'}
Model answer for reference (written earlier by Claude; it may itself be imperfect): ${model || '— none —'}
Evidence to look for: paper ${q.evidence.paper || '—'}; critique ${q.evidence.critique || '—'}

THE STUDENT'S ANSWER:
"""${answer}"""

Reply with only JSON: {"verdict":"ready | almost | not yet","score":3,"good":["what was good"],"missing":["what was missing or unclear"],"errors":["anything that contradicts the paper, with its page"],"better":"a stronger version of the student's OWN answer, in their voice (2–4 sentences)","evidence":"the evidence they should mention","followUp":"${isFollow ? '' : 'one probing follow-up question based on what the student actually said'}","tip":"one short tip for saying it confidently"}
"ready" only if the answer is accurate, answers the question and refers to evidence; "almost" if mostly right but something important is missing; "not yet" otherwise. "score" is 1–5.`;
}
const dFb = r => { r = r && typeof r === 'object' ? r : {}; const v = /ready/i.test(r.verdict) && !/not/i.test(r.verdict) ? 'ready' : /almost/i.test(r.verdict) ? 'almost' : 'not yet';
  return {verdict:v, score:Math.min(5, Math.max(1, Math.round(Number(r.score)) || (v === 'ready' ? 4 : v === 'almost' ? 3 : 2))), good:vArr(r.good).map(x => vStr(x, 300)).filter(Boolean), missing:vArr(r.missing).map(x => vStr(x, 300)).filter(Boolean),
    errors:vArr(r.errors).map(x => vStr(x, 300)).filter(Boolean), better:vStr(r.better, 1200), evidence:vStr(r.evidence, 400), followUp:vStr(r.followUp, 400), tip:vStr(r.tip, 300)}; };
const dMockQ = set => { const m = dState(set).mock; return m && dState(set).qs.find(q => q.id === m.ids[m.i]); };

  const qs = dState(set).qs;

/* ---------- Step 2.4 · Where Did This Come From? — Source Evidence Mapping ----------
   Every statement of the critique (or the slides) is linked to the exact passage of the original paper.
   Claude classifies the statement and quotes the passage; ScholarPath accepts a quotation only when it finds it
   word for word in the paper, and takes the page, section and paragraph from the paper itself — never from Claude.
   Uses the same document set as Part 4 (S.verify.sets). */
const E_TYPES = {
  direct:{t:'Directly Supported', d:'The original paper explicitly states this information.', ic:'check'},
  para:{t:'Paraphrased', d:'The critique restates information from the paper accurately, in different words.', ic:'refresh'},
  interp:{t:'Critical Interpretation', d:'Your own evaluation or interpretation of the research.', ic:'bulb'},
  partial:{t:'Partially Supported', d:'The paper supports part of the statement; more explanation or evidence is needed.', ic:'clock'},
  unsup:{t:'Unsupported', d:'No sufficient evidence was found in the original paper.', ic:'x'},
  ext:{t:'External Evidence', d:'The statement relies on another academic source, not this paper.', ic:'library'},
  none:{t:'Not a claim', d:'A heading, transition or administrative line — nothing to trace.', ic:'pen'}
};
const E_ORDER = ['direct', 'para', 'interp', 'partial', 'unsup', 'ext', 'none'];
const E_NOTVER = 'Source not verified – Exact supporting passage could not be identified.';
const eState = set => { const e = set.ev ||= {}; e.maps ||= {critique:{}, pres:{}}; e.explain ||= {}; e.filters ||= {}; e.target ||= 'critique'; e.view ||= 'viewer'; return e; };

/* the paper as passages with their real page, section and paragraph */
function ePassages(set){
  const d = set.docs.paper; if (!d) return [];
  const fromParas = list => list.map((x, i) => ({id:'P' + (i + 1), n:i + 1, page:x.page || null, section:(x.section || '').trim(), text:x.text, ref:x.id || ''}));
  if (d.src === 'reader'){ const p = S.reader.papers.find(x => x.id === d.ref); return p ? fromParas(p.paras.filter(isReadable)) : []; }
  if (d.paras && d.paras.length) return fromParas(d.paras);
  const out = []; let sec = '';                                            // pasted text or an older upload: paragraphs inside each page
  for (const u of vUnits(set, 'paper')){
    const pm = /^p\. (\d+)/.exec(u.loc), page = pm ? +pm[1] : null;
    const lines = u.text.split('\n'), max = Math.max(...lines.map(l => l.trim().length), 1); let cur = [];
    const flush = () => { const t = cur.join(' ').replace(/\s+/g, ' ').trim(); if (t) out.push({id:'P' + (out.length + 1), n:out.length + 1, page, section:sec, text:t}); cur = []; };
    for (const raw of lines){
      const l = raw.trim(); if (!l){ flush(); continue; }
      if (l.length < 70 && !/[.,;:]$/.test(l) && (/^(?:\d+(?:\.\d+)*\.?|[IVX]{1,5}\.)\s+[A-Z]/.test(l) || /^(abstract|introduction|background|literature review|related work|methods?|methodology|materials and methods|results|findings|discussion|conclusions?|limitations|future work|references|acknowledg(e)?ments?)$/i.test(l) || (/^[A-Z][A-Z\s&-]{3,}$/.test(l) && l.split(' ').length <= 6))){ flush(); sec = l; continue; }
      cur.push(l);
      if (/[.?!]["”’)]?$/.test(l) && l.length < max * 0.72) flush();            // a short line that ends a sentence ends the paragraph
    }
    flush();
  }
  return out;
}
const ePage = (set, page) => { if (!page) return 'Page not given in the document'; const f = parseInt(eState(set).firstPrinted, 10); return `PDF p. ${page}${f ? ` (printed p. ${page + f - 1})` : ''}`; };
function eLocate(P, ev){                                                     // where a quotation really is — or null
  const q = String(ev && ev.quote || '').trim();

}

function stNewDoc(name, kind, raw){

/* --- Claude: shared pieces --- */
function stDocText(doc, max = 60000){
  let out = '', cut = false;
  for (const b of doc.blocks){ const piece = b.kind === 'h' ? `\n[${b.id} · HEADING] ${b.text}\n` : `[${b.id}] ${b.text}\n`; if (out.length + piece.length > max){ cut = true; break; } out += piece; }
  return out + (cut ? '\n[… the rest of the critique was cut to fit — do not guess about it]\n' : '');
}
function stPaperCtx(doc, text, n = 6){                               // the passages of the paper that share the most words with the text (no AI), with their real pages
  const set = stSet(doc), P = set ? ePassages(set) : [];
  if (!P.length) return {has:false, block:'(The student has NOT added the original research paper. Nothing can be checked against it: do not state what the paper says; where the connection to the paper matters, say it must be checked in the paper.)'};
  const seen = new Set(), picks = [];
  for (const c of eCandidates(P, text, n * 3)){ if (seen.has(c.p.id)) continue; seen.add(c.p.id); picks.push(c.p); if (picks.length >= n) break; }
  return {has:true, P, block:picks.length ? picks.map(p => `[${p.id} · ${p.page ? 'PDF p. ' + p.page : 'page unknown'} · ${p.section || 'section unknown'}]\n${clip(p.text, 1600)}`).join('\n\n')
    : '(No passage of the paper shares enough words with this part — say the connection must be checked in the paper.)'};
}
const stLangLine = lang => lang === 'ar' ? 'Write every explanation in clear, natural Modern Standard Arabic that an Arabic-speaking master\'s student understands easily. The first time a technical term appears, add the English term in brackets.' : 'Write in clear, simple academic English (about B1–B2), with short sentences.';

  catch (e){ if (e && e.code !== 'cancelled') alert(aiError(e)); return false; }

}

  if (t.dataset.st === 'prac-ans'){ const sec = stSecOf(doc, stSelId(doc)); if (!doc.prac || doc.prac.sec !== sec.id) doc.prac = {sec:sec.id, i:0}; doc.prac.answer = t.value; save(); return true; }
  return false;
}
function stChange(t){
  if (t.id === 'stCritFile' && t.files[0]){ const file = t.files[0]; t.value = ''; toast('Reading your critique…');
    stReadCritique(file).then(r => { stState().adding = false; stNewDoc(file.name, r.kind, r.blocks); RENDER.studio(); toast('Your critique is ready — exactly as you wrote it'); })
      .catch(err => alert((err && err.message) || 'This file could not be read.')); return true; }
  if (t.id === 'stPaperFile' && t.files[0]){ const f = t.files[0]; t.value = ''; stAddFile('paper', f); return true; }
  if (t.id === 'stPresFile' && t.files[0]){ const f = t.files[0]; t.value = ''; stAddFile('pres', f); return true; }
  if (!t.dataset || !t.dataset.st) return false;
  const st = stState(), doc = stDoc();
  if (t.dataset.st === 'doc'){ st.active = t.value; st.adding = false; stHlSel = null; save(); RENDER.studio(); return true; }
  if (t.dataset.st === 'hl'){ st.hl[t.dataset.k] = t.checked; save(); if (doc) stRenderDoc(doc); return true; }
  if (t.dataset.st === 'rate'){ S.reader.rate = +t.value || 1; save(); return true; }
  if (t.dataset.st === 'reader-paper' && t.value){ const set = stSet(doc); set.docs.paper = {src:'reader', ref:t.value, at:Date.now()}; save(); RENDER.studio(); toast('Paper added from the reader'); return true; }
  if (t.dataset.st === 'check'){ ((doc.check[t.dataset.k] ||= {}))[t.dataset.f] = t.checked; save(); const el = $('#stCheckSum'); if (el) el.innerHTML = stCheckSum(doc); return true; }
  return false;
}
document.addEventListener('selectionchange', () => {                    // selected words in the critique: explain them, or find where they come from
  const box = $('#stSelBox'); if (!box || S.ui.tab !== 'studio') return;
  const s = getSelection(), n = s && !s.isCollapsed && s.anchorNode, el = n && (n.nodeType === 1 ? n : n.parentElement);
  const t = s ? s.toString().replace(/\s+/g, ' ').trim() : '';
  if (el && $('#stDoc') && $('#stDoc').contains(el) && t.length > 3 && t !== stSelText){ stSelText = t.slice(0, 1500); clearTimeout(stSelT); stSelT = setTimeout(() => { const d = stDoc(); if (d) box.innerHTML = stSelBoxHTML(d); stRenderRun(); }, 250); }
});
let stSelT = 0;
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('sth')){ e.preventDefault(); ST_ACTIONS['st-hl'](e.target); } });
Object.assign(ACTIONS, V_ACTIONS, D_ACTIONS, E_ACTIONS, ST_ACTIONS);
document.addEventListener('click', e => {
  $$('details.menu[open]').forEach(d => { if (!d.contains(e.target) || e.target.closest('.menu-item')) d.open = false; });
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'q' && e.key === 'Enter'){ e.preventDefault(); ACTIONS.search(); }
  if (e.target.dataset.chatIn && e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); const sc = e.target.dataset.chatIn; const q = e.target.value; e.target.value = ''; chatSend(sc, q); }
  if (e.key === 'Escape' && $('#app').classList.contains('side-open')){ e.preventDefault(); sideDrawer(false); }
  if (e.key === 'Escape' && !$('#app').classList.contains('side-open')){            // one thing at a time: a menu, the audio settings, the study panel, the outline
    const menu = e.target.closest && e.target.closest('details.menu[open]');
    if (menu){ e.preventDefault(); menu.open = false; menu.querySelector('summary').focus(); }
    else if (S.reader.playerOpen && e.target.closest('#ttsBar')){ e.preventDefault(); ACTIONS['tts-panel'](); }
    else if ($('#rd.as-open')){ e.preventDefault(); ACTIONS['rp-assist-close'](); }
    else if ($('#rd[data-ol]') && rdOlOverlay()){ e.preventDefault(); rdOutline(false); }
  }
  if (e.target.dataset.concept && e.key === 'Enter' && !e.isComposing){ e.preventDefault(); rdConceptAdd(e.target.dataset.concept, e.target.value); }
  if (e.target.classList.contains('as-tab') && /^(ArrowRight|ArrowLeft|Home|End)$/.test(e.key)){
    e.preventDefault(); const k = AS_TABS.findIndex(([t]) => t === e.target.dataset.tab), n = AS_TABS.length;
    const to = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : (k + (e.key === 'ArrowRight' ? 1 : -1) + n) % n;
    S.reader.as = AS_TABS[to][0]; save(); renderAssist(); $('#as-tab-' + S.reader.as)?.focus();
  }
  if (e.target.id === 'rpTitle' && e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener('input', e => {
  const t = e.target, c = () => activeCrit();
  if (vInput(t) || dInput(t) || eInput(t) || stInput(t)) return;
  if (t.dataset.chatIn){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 160) + 'px'; return; }
  if (t.dataset.fl){ const r = activeFig(); r[t.dataset.fl] = t.value; save(); updateExplain(); return; }
  if (t.dataset.fb){ S.figlab.build.chart[t.dataset.fb] = t.value; save(); updateBuild(); return; }
  if (t.dataset.fbs){ S.figlab.build.chart.series[+t.dataset.fbs][t.dataset.field] = t.value; save(); updateBuild(); return; }
  if (t.dataset.fcap){ S.figlab.build.cap[t.dataset.fcap] = t.value; save(); updateBuild(); return; }
  if (t.dataset.rp === 'simple'){ const para = rPaper().paras.find(x => x.id === t.dataset.id); if (para){ para.simple = t.value; para.simpleSrc = t.value.trim() ? 'me' : ''; save(); grow(t); const d = $('#rpDone'); if (d) d.textContent = rPaper().paras.filter(x => isReadable(x) && simpleOf(x)).length; if (rdMode() === 'simple') rdCardSoon(para); } return; }
  if (t.dataset.rp === 'ar'){ const para = rPaper().paras.find(x => x.id === t.dataset.id); if (para){ para.ar = t.value; para.arSrc = 'me'; save(); grow(t); if (rdMode() === 'ar') rdCardSoon(para); } return; }
  if (t.dataset.rp === 'idea' || t.dataset.rp === 'mine' || t.dataset.rp === 'notes'){
    const para = rPaper().paras.find(x => x.id === t.dataset.id); if (!para) return;
    if (t.dataset.rp === 'idea'){ para.idea = t.value; para.src = t.value.trim() ? 'me' : ''; grow(t); } else if (t.dataset.rp === 'notes'){ para.notes = t.value; grow(t); } else para.mine = t.value;
    rdSaved();
    save(); const n = $('#rpNotes'); if (n) n.textContent = readingNotes(rPaper()); return;
  }
  if (t.dataset.ps){ const o = (S.pres.outlines || {})[S.pres.source], sl = o && o.slides[+t.dataset.i]; if (!sl) return;
    const k = t.dataset.ps; if (k === 'bullets') sl.bullets = t.value.split('\n').map(b => b.trim()).filter(Boolean); else if (k === 'secs') sl.secs = Math.max(0, Math.round(+t.value || 0)); else sl[k] = t.value;
    save(); const out = $('#presOut'); if (out) out.textContent = presOutline(); return; }
  if (t.id === 'rdFind'){ clearTimeout(rdFindT); rdFindT = setTimeout(() => rdFind(t.value), 150); return; }
  if (t.id === 'rpTitle'){ if (/\n/.test(t.value)) t.value = t.value.replace(/\s*\n\s*/g, ' '); grow(t); const p = rPaper(); p.title = t.value; save(); const o = $('#rpSel option:checked'); if (o) o.textContent = (p.example?'[Demo] ':'') + clip(t.value || p.name, 70); return; }
  if (t.id === 'q' || t.id === 'yr'){ S.ui[t.id] = t.value; save(); }
  else if (t.dataset.ai){ const cc = c(); cc.info[t.dataset.ai] = t.value; save(); updateAau();
    if (t.dataset.ai === 'title'){ const o = $('#critSel option:checked'); if (o) o.innerHTML = critOptLabel(cc); } }
  else if (t.dataset.ab){ (c().b[t.dataset.ab] ||= {}).text = t.value; save(); updateAau(); grow(t); }
  else if (t.dataset.aev){ (c().b[t.dataset.aev] ||= {}).ev = t.value; save(); }
  else if (t.dataset.an){ (c().partA[t.dataset.an] ||= {}).note = t.value; save(); }
  else if (t.dataset.ref){ c().refs[+t.dataset.ref].text = t.value; save(); updateAau(); }
  else if (t.id === 'evq'){ evidenceSearch(t.value); }
  else if (t.dataset.crit){ const s = c().sections[t.dataset.crit] ||= {}; s.text = t.value; save(); updateCritChrome(); }
  else if (t.dataset.cite){ c().citation[t.dataset.cite] = t.value; save(); updateCritChrome();
    if (t.dataset.cite === 'title'){ const o = $('#critSel option:checked'); if (o) o.innerHTML = critOptLabel(c()); } }
  else if (t.dataset.wnotes){ stepState(t.dataset.wnotes).notes = t.value; save(); const o = $('#outlineOut'); if (o) o.textContent = paperOutline(); }
  else if (t.id === 'wTitle'){ S.writing.title = t.value; save(); const o = $('#outlineOut'); if (o) o.textContent = paperOutline(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (vChange(t) || dChange(t) || eChange(t) || stChange(t)) return;
  if (t.dataset.fl === 'critId'){ RENDER.figlab(); return; }
  if (t.id === 'presFile' && t.files[0]){ const file = t.files[0]; t.value = ''; toast('Reading your critique…');
    presReadFile(file).then(units => presAddCritique(file.name, (file.name.split('.').pop() || '').toLowerCase(), units)).catch(err => alert((err && err.message) || 'This file could not be read.')); return; }
  if (t.id === 'flScanCrit'){ S.figlab.scanCrit = t.value; save(); RENDER.figlab(); return; }
  if (t.dataset.fsel !== undefined){ figScan.items[+t.dataset.fsel].sel = t.checked; const n = figScan.items.filter(i => i.sel).length;
    $$('[data-act="fl-scan-go"]').forEach(b => { b.disabled = !n; b.innerHTML = b.dataset.v === 'ai' ? `${icon('sparkle')}Analyse ${n} with Claude` : `${icon('plus')}${aiReady() ? 'Only create reviews' : `Create ${n} review${n === 1 ? '' : 's'}`}`; }); return; }
  if (t.id === 'flPdf' && t.files[0]){
    const file = t.files[0]; t.value = ''; toast('Looking for figures and tables…');
    scanFigures(file).then(sc => {
      figScan = sc;
      figScan.items.forEach(it => { it.sel = !S.figlab.reviews.some(r => r.critId === (S.figlab.scanCrit || '') && normFig(r.figNo) === normFig(it.label) && r.ai); });
      RENDER.figlab(); toast(`${sc.items.length} figure${sc.items.length === 1 ? '' : 's'} and table${sc.items.length === 1 ? '' : 's'} found`);
    }).catch(err => alert('Could not read this PDF. ' + (err && err.message || '')));
    return;
  }
  if (t.id === 'flFilter'){ S.figlab.filter = t.value; const vis = S.figlab.reviews.filter(r => !t.value || r.critId === t.value); if (vis.length && !vis.includes(activeFig())) S.figlab.active = vis[0].id; save(); RENDER.figlab(); return; }
  if (t.dataset.flc){ const r = activeFig(); r.checks[t.dataset.flc] = t.checked; t.closest('.check').classList.toggle('on', t.checked); save(); updateExplain(); return; }
  if (t.dataset.flr !== undefined){ const r = activeFig(); r.flags[+t.dataset.flr] = t.checked; t.closest('.check').classList.toggle('on-flag', t.checked); save(); updateExplain(); return; }
  if (t.dataset.rp === 'rel' || t.dataset.rp === 'to'){
    const para = rPaper().paras.find(x => x.id === t.dataset.id); if (!para) return;
    para.link[t.dataset.rp] = t.value;
    if (t.dataset.rp === 'to' && t.value && !para.link.rel) para.link.rel = 'supports';
    if (t.dataset.rp === 'to' && !t.value) para.link.rel = '';
    save(); refreshCards([para]); return;
  }
  if (t.id === 'rpSel'){ if (TTS.playing) ttsPause(); chatOpen = null; S.reader.active = t.value; save(); RENDER.reader(); return; }
  if (t.id === 'ttsVer'){ rdSetMode(t.value, true); return; }
  if (t.id === 'cmpSync'){ S.reader.cmpSync = t.checked; save(); if (t.checked){ const L = $('#cmpL'); if (L) cmpFollow(L); } return; }
  if (t.id === 'ttsRate' || t.id === 'ttsVol'){ S.reader[t.id === 'ttsRate' ? 'rate' : 'volume'] = +t.value; save(); if (TTS.playing){ ttsHalt(); ttsSpeak(false); } return; }
  if (t.dataset.ttsopt){ const k = t.dataset.ttsopt; S.reader[k] = k === 'cites' ? (t.checked ? 'skip' : 'read') : t.checked; save(); if (TTS.playing){ ttsHalt(); ttsSpeak(false); } return; }
  if (t.id === 'ttsVoiceEn' || t.id === 'ttsVoiceAr'){ S.reader[t.id === 'ttsVoiceEn' ? 'voiceEn' : 'voiceAr'] = t.value; save(); if (TTS.playing){ ttsHalt(); ttsSpeak(false); } else renderTtsBar(); return; }
  if (t.id === 'rpFile' && t.files[0]){
    const file = t.files[0]; t.value = ''; toast('Reading the paper…');
    pdfToParagraphs(file).then(res => {
      if (!res.paras.length){ alert('No text could be found — the PDF may be a scanned image. Try “Paste text” instead.'); return; }
      const name = file.name.replace(/\.pdf$/i, '');
      addReaderPaper(file.name, name, res, file);
    }).catch(err => alert('Could not read this PDF. ' + (err && err.message || '')));
    return;
  }
  if (t.id === 'dbSel'){ S.ui.db = t.value; save(); if ($('#q').value.trim()) buildSearch(); }
  else if (t.id === 'tagSel'){ S.ui.tag = t.value; save(); RENDER.ideas(); }
  else if (t.id === 'paperIdeaSel'){ S.ui.paperIdea = t.value; save(); RENDER.ideas(); }
  else if (t.dataset.change === 'idea-status'){ const i = findIdea(t.dataset.id); if (i){ i.status = t.value; save(); RENDER.ideas(); toast(`Moved to ${t.value}`); } }
  else if (t.id === 'critSel'){ S.activeCrit = t.value; save(); RENDER.critique(); }
  else if (t.dataset.arev){ (activeCrit().b[t.dataset.arev] ||= {}).rev = t.checked; save(); }
  else if (t.dataset.refok !== undefined){ activeCrit().refs[+t.dataset.refok].ok = t.checked; save(); updateAau(); }
  else if (t.dataset.qc !== undefined){ activeCrit().qc[+t.dataset.qc] = t.checked; t.closest('.check').classList.toggle('on', t.checked); save(); updateAau(); }
  else if (t.id === 'pdfFile' && t.files[0]){
    const file = t.files[0], c = activeCrit(); t.value = '';
    toast('Reading the paper…');
    extractPdf(file).then(pages => {
      if (!pages.join('').trim()) { alert('No text could be extracted — the PDF may be a scanned image. Try a text-based PDF.'); return; }
      c.paper = {name:file.name, pages}; save(); RENDER.critique(); toast(`Paper loaded: ${pages.length} pages`); $('#evq')?.focus();
    }).catch(err => alert('Could not read this PDF. ' + (err && err.message || '')));
  }
  else if (t.dataset.change === 'crit-rec'){ activeCrit().recommendation = t.value; save(); }
  else if (t.dataset.wcheck !== undefined){
    const st = WRITE_STEPS[S.writing.active|0], ws = stepState(st.key);
    ws.checks[+t.dataset.wcheck] = t.checked; save();
    t.closest('.check').classList.toggle('on', t.checked);
    $('#stepper').innerHTML = stepperHTML(S.writing.active|0);
    const d = WRITE_STEPS.filter(stepDone).length; $('#wDoneN').textContent = d; $('#wBar').style.width = (d/WRITE_STEPS.length*100)+'%';
    $('#outlineOut').textContent = paperOutline();
    if (stepDone(st) && t.checked) toast(`Step complete: ${st.title}`);
  }
  else if (t.dataset.review !== undefined){
    S.writing.review[+t.dataset.review] = t.checked; save();
    t.closest('.check').classList.toggle('on', t.checked);
    const n = SELF_REVIEW.filter((_,i) => S.writing.review[i]).length;
    $('#revN').textContent = n; $('#revMsg').textContent = n === SELF_REVIEW.length ? '✓ Ready to submit — good luck!' : 'Tick every item before you press submit.';
  }
  else if (t.id === 'presSrc'){ S.pres.source = t.value; presEdit = -1; save(); RENDER.present(); }
  else if (t.id === 'importFile' && t.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.ideas) || !Array.isArray(d.papers) || !Array.isArray(d.critiques)) throw new Error('bad');
        if (!confirm('Replace your current ScholarPath data with this backup?')) return;
        S = Object.assign(seedState(), d); S.ui = Object.assign(seedState().ui, d.ui, {tab:'progress'});
        S.writing = Object.assign(seedState().writing, d.writing); S.pres = Object.assign(seedState().pres, d.pres); S.reader = Object.assign({papers:[], active:'', view:'paras'}, d.reader); S.figlab = Object.assign(seedState().figlab, d.figlab); S.verify = Object.assign(seedState().verify, d.verify);
        save(); applyTheme(); showTab('progress'); toast('Backup restored');
      } catch { alert('That file is not a valid ScholarPath backup.'); }
    };
    r.readAsText(t.files[0]); t.value = '';
  }
});
window.addEventListener('hashchange', () => route(location.hash));
document.addEventListener('toggle', e => { if (e.target.id === 'vDocsWrap'){ S.ui.docsOpen = e.target.open; save(); const a = e.target.querySelector('.v-docs-act'); if (a) a.firstChild.textContent = e.target.open ? 'Hide documents' : 'Manage documents'; } }, true);

/* ---------- Boot ---------- */
$('.brand-mark').innerHTML = icon('cap');
$('.top-logo span').innerHTML = icon('cap');
$('.menu-btn').innerHTML = icon('menu');
$('.side-close').innerHTML = icon('x');
applySide();
S.critiques.forEach(fixCrit);
if (S.reader){ if (!['read', 'study', 'compare'].includes(S.reader.layout)) S.reader.layout = 'read'; S.reader.ol ||= {read:false, study:false, compare:false}; }
if (S.reader && S.reader.partsV !== 3){ if (S.reader.mode === 'both') S.reader.mode = 'ar'; delete S.reader.ttsParts; S.reader.partsV = 3; save(); }   // the version shown decides what is read
applyTheme(); applyFs();
route(location.hash);
})();
