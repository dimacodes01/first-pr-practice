<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScholarPath</title>
<meta name="description" content="ScholarPath — a research companion for master's students and early researchers: find literature, organise ideas, critique papers, write and present.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f1efe9; --ink:#1a2233; --muted:#5b6476; --line:#e3e0d7;
  --accent:#1f3a6b; --accent-hover:#16305b; --accent-ink:#ffffff; --accent-soft:#e7edf7;
  --ok:#2d7650; --ok-soft:#e3f1e8; --warn:#9a640f; --warn-soft:#f7ecd8; --danger:#a63838; --danger-soft:#f7e3e3;
  --violet:#5b4a9b; --violet-soft:#ece8f7; --example:#8a5a12; --example-soft:#fbf0dc;
  --shadow:0 1px 2px rgba(20,30,50,.05),0 4px 16px rgba(20,30,50,.05);
  --radius:14px; --radius-sm:9px;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e131d; --surface:#151c2a; --surface-2:#1b2435; --ink:#e6e9f0; --muted:#9aa3b6; --line:#273145;
    --accent:#90b0e8; --accent-hover:#a9c3f0; --accent-ink:#0e131d; --accent-soft:#1d2a44;
    --ok:#7cc79c; --ok-soft:#173226; --warn:#e3b264; --warn-soft:#33281a; --danger:#ec8f8f; --danger-soft:#3a1f22;
    --violet:#b6a7ec; --violet-soft:#29233f; --example:#e7b76c; --example-soft:#33291a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.25);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131d; --surface:#151c2a; --surface-2:#1b2435; --ink:#e6e9f0; --muted:#9aa3b6; --line:#273145;
  --accent:#90b0e8; --accent-hover:#a9c3f0; --accent-ink:#0e131d; --accent-soft:#1d2a44;
  --ok:#7cc79c; --ok-soft:#173226; --warn:#e3b264; --warn-soft:#33281a; --danger:#ec8f8f; --danger-soft:#3a1f22;
  --violet:#b6a7ec; --violet-soft:#29233f; --example:#e7b76c; --example-soft:#33291a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.25);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.25;margin:0 0 .4em;letter-spacing:-.005em}
h1{font-size:1.9rem} h2{font-size:1.5rem} h3{font-size:1.15rem} h4{font-size:1rem}
p{margin:0 0 .8em}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

/* Header + tabs */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-family:var(--serif);font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.brand-tag{font-size:.8rem;color:var(--muted);display:none}
@media(min-width:720px){.brand-tag{display:block}}
.spacer{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 .9rem var(--sans);padding:10px 8px 12px;display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;border-bottom:2.5px solid transparent;border-radius:0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:6px}

main{max-width:1180px;margin:0 auto;padding:28px 16px 80px}
.panel[hidden]{display:none}
.page-head{margin-bottom:22px}
.page-head p{color:var(--muted);max-width:68ch;margin:0}
.eyebrow{font:600 .74rem var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.g-2{grid-template-columns:1fr}
@media(min-width:900px){.g-2{grid-template-columns:1fr 1fr}.g-side{grid-template-columns:1.6fr 1fr}}
.g-side{grid-template-columns:1fr}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.section-title{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:30px 0 14px}
.section-title h2,.section-title h3{margin:0}

/* Buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .9rem var(--sans);padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;text-decoration:none;min-height:38px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.84rem}
.btn.icon{padding:6px;min-width:34px;min-height:34px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}

/* Forms */
label.f{display:block;font-weight:500;font-size:.86rem;margin-bottom:5px}
.input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;min-height:40px}
textarea{min-height:110px;resize:vertical;line-height:1.55}
.input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.field{margin-bottom:14px}
.fields-2{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:620px){.fields-2{grid-template-columns:1fr 1fr}}

/* Chips & badges */
.chip{display:inline-flex;align-items:center;gap:5px;font:500 .78rem var(--sans);padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.tag{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge-example{display:inline-flex;align-items:center;gap:4px;font:600 .7rem var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--example-soft);color:var(--example)}
.status{font:600 .74rem var(--sans);padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-Idea{background:var(--violet-soft);color:var(--violet)}
.st-Exploring{background:var(--accent-soft);color:var(--accent)}
.st-Drafting{background:var(--warn-soft);color:var(--warn)}
.st-Done{background:var(--ok-soft);color:var(--ok)}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 .84rem var(--sans);padding:6px 12px;border-radius:999px;cursor:pointer;min-height:34px}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Resource hub */
.db-card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.db-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.db-top{display:flex;align-items:center;gap:10px}
.db-logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:700 .82rem var(--sans);color:#fff;flex:none;letter-spacing:.02em}
.db-name{font-family:var(--serif);font-weight:600;font-size:1.05rem;flex:1}
.db-desc{color:var(--muted);font-size:.9rem;margin:0}
.db-cta{margin-top:auto;font-size:.82rem;color:var(--accent);display:flex;gap:5px;align-items:center;font-weight:500}
.search-card{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.search-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.search-grid{grid-template-columns:200px 1fr 120px auto;align-items:end}}
.output{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;font:13px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--ink);max-height:520px;overflow:auto}
.output-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.tips li{margin-bottom:8px}
.tips code,.kbd{font:12.5px var(--mono);background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;white-space:nowrap}

/* Ideas */
.idea-card{display:flex;flex-direction:column;gap:10px}
.idea-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.idea-head h3{margin:0;font-size:1.08rem}
.rq{font-family:var(--serif);font-style:italic;color:var(--ink);border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:0}
.kw{font-size:.84rem;color:var(--muted)}
.card-foot{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.status-select{width:auto;min-height:32px;padding:4px 8px;font-size:.84rem}
.paper-list{display:flex;flex-direction:column;gap:10px}
.paper{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 16px}
.paper-title{font-family:var(--serif);font-weight:600;font-size:1.02rem;margin:0}
.paper-meta{font-size:.86rem;color:var(--muted)}
.takeaway{font-size:.92rem;margin:4px 0 0}
.paper-actions{display:flex;gap:4px;align-items:flex-start}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--radius);background:transparent}

/* Critique */
.crit-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress > span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.sec{scroll-margin-top:130px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sec-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 .82rem var(--sans);background:var(--accent-soft);color:var(--accent);flex:none}
.sec.filled .sec-num{background:var(--accent);color:var(--accent-ink)}
.sec-head h3{margin:0;flex:1}
.prompts{margin:0 0 12px;padding:12px 14px 12px 32px;background:var(--surface-2);border-radius:var(--radius-sm);font-size:.9rem;color:var(--muted)}
.prompts li{margin-bottom:3px}
.rating{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:10px}
.rating .lbl{font-size:.84rem;color:var(--muted);margin-right:6px}
.rate{appearance:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .9rem var(--sans);cursor:pointer}
.rate:hover{border-color:var(--accent);color:var(--accent)}
.rate[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate-hint{font-size:.8rem;color:var(--muted);margin-left:6px}
.jump{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.jump a{flex:none;font-size:.8rem;text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.jump a.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
@media(min-width:760px){.sticky-sub{position:sticky;top:110px;z-index:5}}


/* AAU critique form */
.form-part{font:600 .76rem var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:30px 0 10px;display:flex;align-items:center;gap:10px}
.form-part::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-head{flex-wrap:wrap}
.sec-num svg{width:15px;height:15px}
.pill{font:600 .74rem var(--sans);padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.wc{margin-left:auto;font:600 .8rem var(--mono);color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:999px;white-space:nowrap}
.wc.ok{color:var(--ok);background:var(--ok-soft)}
.wc.over{color:var(--danger);background:var(--danger-soft)}
.fields-3{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:620px){.fields-3{grid-template-columns:1fr 1fr}.fields-3 .wide{grid-column:1/-1}}
@media(min-width:980px){.fields-3{grid-template-columns:1fr 1fr 1fr}}
details.what{margin:0 0 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2)}
details.what summary{cursor:pointer;padding:8px 12px;font-weight:500;font-size:.88rem;color:var(--accent)}
details.what ol{margin:0;padding:0 14px 10px 34px;font-size:.88rem;color:var(--muted)}
details.what li{margin-bottom:3px}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;background:var(--warn-soft);color:var(--ink);padding:9px 12px;border-radius:var(--radius-sm);margin:0 0 12px}
.warn svg{color:var(--warn);margin-top:2px}
.parta{display:grid;gap:10px;grid-template-columns:1fr;padding:14px 0;border-top:1px solid var(--line)}
.parta .rating{margin:0}
@media(min-width:900px){.parta{grid-template-columns:1.3fr auto 1.2fr;align-items:center}}
.refs{display:flex;flex-direction:column;gap:10px}
.ref-row{display:grid;grid-template-columns:34px 1fr;gap:6px 8px;align-items:start}
.ref-row textarea{min-height:58px;font-size:.9rem}
.ref-n{font:600 .86rem var(--mono);color:var(--accent);padding-top:10px}
.ref-tools{grid-column:2;display:flex;gap:6px;align-items:center;margin-top:-2px}
@media(min-width:760px){.ref-row{grid-template-columns:34px 1fr auto}.ref-tools{grid-column:auto;flex-direction:column;align-items:flex-start;margin:0}}
.sub{padding:16px 0 4px;border-top:1px solid var(--line)}
.sub:first-of-type{border-top:0}
.sub h4{font-size:1.05rem}
.sub details.what{margin-top:10px}
.reserved{opacity:.85;border-style:dashed}
.input.ro{background:var(--surface-2);color:var(--muted);display:flex;align-items:center}
.qc-auto{cursor:default}
.qc-auto .qc-ico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px;background:var(--danger-soft);color:var(--danger)}
.qc-auto.pass .qc-ico{background:var(--ok-soft);color:var(--ok)}
.qc-ico svg{width:13px;height:13px;stroke-width:2.6}
.ev-results{max-height:320px;overflow:auto;margin-top:4px}
.ev-hit{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:.86rem;padding:8px 4px;border-bottom:1px solid var(--line)}
.ev-hit b{color:var(--accent);font-family:var(--mono);font-size:.8rem}
mark{background:var(--warn-soft);color:var(--ink);padding:0 2px;border-radius:3px;font-weight:600}


/* Paper Reader */
.title-input{font-family:var(--serif);font-size:1.05rem;font-weight:600;border-color:transparent;background:transparent;padding-left:4px}
.title-input:hover,.title-input:focus{border-color:var(--line);background:var(--surface)}
.ok-chip{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.para{margin-bottom:12px;scroll-margin-top:150px;transition:box-shadow .3s}
.para.has-idea{border-left:3px solid var(--ok)}
.para.front{background:transparent;box-shadow:none}
.para.flash{box-shadow:0 0 0 3px var(--accent)}
.para-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.para-no{font:600 .8rem var(--mono);color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;flex:none}
details.orig{margin:0 0 12px}
details.orig summary{list-style:none;cursor:pointer;font-family:var(--serif);font-size:.98rem;line-height:1.6;color:var(--ink)}
details.orig summary::-webkit-details-marker{display:none}
details.orig summary .orig-text{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
details.orig summary::after{content:"Show full paragraph";display:block;font:500 .8rem var(--sans);color:var(--accent);margin-top:4px}
details.orig[open] summary{display:none}
.orig-full{font-family:var(--serif);font-size:.98rem;line-height:1.65;background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px}
.idea-lbl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
textarea[data-rp]{min-height:62px;font-size:.95rem}
.ai-alt{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--radius-sm);padding:8px 12px;margin-top:8px}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.term{font-size:.82rem;background:var(--violet-soft);color:var(--ink);padding:4px 10px;border-radius:999px}
.term b{color:var(--violet)}
.para-foot{display:grid;gap:12px;grid-template-columns:1fr;margin-top:12px}
@media(min-width:820px){.para-foot{grid-template-columns:1fr 1fr}}
.para-foot select{min-height:38px}
.link-line{display:block;margin-top:6px;text-decoration:none}
.ai-run{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:10px;font-size:.88rem;background:var(--accent-soft);padding:8px 12px;border-radius:var(--radius-sm)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
ol.flow{list-style:none;margin:0;padding:0;position:relative}
.flow-sec{font:600 .76rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.flow-item{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0 10px 12px;border-left:2px solid var(--line);margin-left:6px}
.flow-item .para-no{align-self:start;margin-top:2px}
.flow-item.empty-idea{color:var(--muted)}
.flow-link{display:inline-block;margin-top:4px;font-size:.8rem;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
ol.qs{margin:12px 0 0;padding-left:22px}
ol.qs li{margin-bottom:12px}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}


/* Figure Lab */
.mode-seg button{display:inline-flex;align-items:center;gap:7px;padding:10px 16px}
.fl-layout{display:grid;gap:16px;grid-template-columns:1fr}
.fl-layout > *{min-width:0}
@media(min-width:900px){.fl-layout{grid-template-columns:270px 1fr;align-items:start}.fl-list{position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto}}
.fl-group{font:600 .72rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.fl-item{appearance:none;display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:.88rem;color:var(--ink);padding:8px;border-radius:var(--radius-sm);cursor:pointer}
.fl-item:hover{background:var(--surface-2)}
.fl-item[aria-current="true"]{background:var(--accent-soft)}
.fl-item-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-ok{color:var(--ok);display:flex}
.type-grid{display:flex;flex-wrap:wrap;gap:6px}
ol.steps{margin:0;padding-left:20px;font-size:.92rem}

.check.flag.on-flag span{color:var(--danger);text-decoration:none}
.checks-2{display:grid;grid-template-columns:1fr;gap:2px;margin:0 -10px}
@media(min-width:760px){.checks-2{grid-template-columns:1fr 1fr}}
.check-na{display:flex;align-items:center;gap:4px}
.check-na .check{flex:1}
.check-na.is-na .check span{color:var(--muted);text-decoration:line-through}
.na-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .7rem var(--sans);padding:3px 7px;border-radius:999px;cursor:pointer;min-height:26px}
.na-btn[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);border-color:var(--muted)}
.output.prose{font:15px/1.65 var(--serif);white-space:normal}
.output.code{max-height:260px;font-size:12px}
.goal-card{display:grid;gap:16px;grid-template-columns:1fr;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
@media(min-width:760px){.goal-card{grid-template-columns:220px 1fr}}
.goal-prev{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px;display:grid;place-items:center;align-self:start}
svg.mini{width:100%;max-width:220px;height:auto;display:block}
.builder{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:980px){.builder{grid-template-columns:1fr 1.2fr;align-items:start}}
.series-row{display:grid;grid-template-columns:14px minmax(0,.8fr) minmax(0,1.4fr);gap:8px;align-items:center;margin-bottom:8px}
.swatch{width:14px;height:14px;border-radius:4px}
.chart-frame{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px}
.chart-frame svg{width:100%;height:auto;display:block}
.chart-frame path:hover,.chart-frame g:hover{opacity:.8}


/* Paper Reader: audio + chat */
@media(max-width:520px){.hide-sm{display:none}}
.part-lbl{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.86rem;margin:2px 0 6px;color:var(--muted)}
.orig-full{margin-bottom:14px}
.para.speaking{box-shadow:0 0 0 2px var(--accent)}
.speaking-part{outline:3px solid var(--accent-soft);outline-offset:2px;background:var(--accent-soft)!important}
.para-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.listen .small{display:inline-flex;align-items:center;gap:4px}
.tts-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tts-bar b{display:inline-flex;align-items:center;gap:5px}
.tts-bar select{min-height:32px;padding:4px 8px;font-size:.84rem}
.ask-card{margin-bottom:16px;border-left:3px solid var(--accent)}
.ask-card h3{display:flex;align-items:center;gap:8px}
.chat{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);padding:12px}
.chat-msgs{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;margin-bottom:10px}
.chat-msgs:empty{display:none}
.msg{padding:10px 14px;border-radius:14px;max-width:92%;font-size:.94rem;line-height:1.55}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul,.msg ol{margin:4px 0 6px;padding-left:20px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.pending[hidden]{display:none}
.msg-tools{display:flex;gap:4px;margin:6px -8px -6px}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fchip.sm-chip{font-size:.8rem;padding:4px 10px;min-height:30px}
.chat-input{display:flex;gap:8px;align-items:flex-end}
.chat-input textarea{min-height:42px;max-height:160px;resize:none}
.chat-input .btn{min-width:44px;min-height:42px}


/* Figure Lab: paper scan */
.scan-card{border-left:3px solid var(--accent)}
.scan-head{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.scan-list{display:flex;flex-direction:column;gap:2px;margin-top:8px;max-height:340px;overflow:auto}
.scan-item{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:10px;align-items:center;padding:8px;border-radius:var(--radius-sm);cursor:pointer;font-size:.9rem}
.scan-item:hover{background:var(--surface-2)}
.scan-item input{width:18px;height:18px;accent-color:var(--accent)}
.scan-cap{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:620px){.scan-item{grid-template-columns:auto auto 1fr}.scan-item .scan-cap{grid-column:2/-1;white-space:normal}}
.fig-shot{margin:4px 0 14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px;text-align:center}
.fig-shot img{max-width:100%;max-height:420px;display:block;margin:0 auto 6px}
.fig-shot .small{text-align:left}
.ai-note{margin:-4px 0 12px;padding:8px 10px;background:var(--accent-soft);border-radius:var(--radius-sm)}

.tts-bar{display:flex;flex-direction:column;gap:8px}
.tts-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tts-status{color:var(--accent);font-weight:500}
.seg.seg-sm button{padding:5px 11px;min-height:32px;font-size:.84rem}
.voice-more summary{cursor:pointer;color:var(--accent)}
.voice-more label{display:inline-flex;align-items:center;gap:6px}
mark.tts-now{background:var(--warn-soft);color:var(--ink);border-radius:3px;padding:0 1px}
.ar-text{font-size:1.02rem;line-height:1.8;font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,var(--sans)}


/* Simple version of a paragraph */
.simple-lbl{color:var(--ok)}
.simple-box{width:100%;margin-bottom:14px}
textarea.simple-box{min-height:80px;font-size:.98rem;line-height:1.65;border-color:color-mix(in srgb,var(--ok) 35%,var(--line));background:color-mix(in srgb,var(--ok-soft) 45%,var(--surface))}
.simple-empty,.simple-busy{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:var(--radius-sm)}
.simple-busy{color:var(--accent);font-size:.92rem;border-style:solid;background:var(--accent-soft)}

/* Writing */
.write-layout{display:grid;gap:16px;grid-template-columns:1fr}

.stepper{display:flex;flex-direction:column;gap:2px;padding:10px}

.step-btn:hover{background:var(--surface-2)}
.step-btn[aria-current="step"]{background:var(--accent-soft);color:var(--accent)}

.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer}

.explain{background:var(--accent-soft);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px}
.explain p:last-child{margin:0}
.step-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
details.guide{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}

details.guide summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:1.08rem}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}

.guide-body{padding:0 18px 18px}
.ieee-table{width:100%;border-collapse:collapse;font-size:.9rem}

.ieee-table th{font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.table-wrap{overflow-x:auto}

.slides{display:grid;gap:14px;grid-template-columns:1fr}

.slide{display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.slide-head{display:flex;align-items:center;gap:10px}
.slide-no{font:600 .76rem var(--sans);color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.slide-time{margin-left:auto;font:600 .8rem var(--mono);color:var(--muted)}
.slide h3{margin:0}
.slide ul{margin:0;padding-left:20px;font-size:.92rem}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}

.timeline{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;margin:8px 0 4px}
.timeline span{background:var(--accent);opacity:.85}
.timeline span:nth-child(even){opacity:.55}

/* Progress */
.stats{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:620px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{display:flex;flex-direction:column;gap:4px}
.stat-ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.stat-num{font-family:var(--serif);font-size:2.1rem;font-weight:600;line-height:1}
.stat-lbl{color:var(--muted);font-size:.88rem}
.bar-row{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;margin-bottom:10px;font-size:.88rem}
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar > span{display:block;height:100%;border-radius:999px}
.steps-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.step-mini{display:flex;align-items:center;gap:8px;font-size:.88rem;padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface-2)}
.step-mini .step-dot{width:22px;height:22px;font-size:.7rem}
.step-mini.done .step-dot{background:var(--ok);border-color:var(--ok);color:#fff}

/* Dialog + toast */
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);padding:0;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.25)}

.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0}
.dlg-body{padding:18px}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:100;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer.foot{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.84rem;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

    b:{
      summary:b('Commercial facial-analysis services were marketed with high overall accuracy, yet their performance across demographic subgroups had not been examined systematically. Buolamwini and Gebru investigate whether automated gender classifiers perform equally well for groups defined jointly by gender and skin type. The authors first analyse two widely used face benchmarks, IJB-A and Adience, and report that both consist overwhelmingly of lighter-skinned subjects. They then build the Pilot Parliaments Benchmark (PPB): 1,270 images of parliamentarians from three African and three European countries, labelled for binary gender and for skin type using the Fitzpatrick scale. Using PPB, they audit three commercial gender-classification services (Microsoft, IBM and Face++) and report error rates for four intersectional subgroups. All three performed better on male than female faces and on lighter than darker faces; darker-skinned females had the highest error rates (up to 34.7%), while lighter-skinned males had error rates of at most 0.8%. The authors conclude that aggregate accuracy can hide substantial subgroup disparities and that intersectional, phenotype-based evaluation is needed, within the limits of binary gender labels and the systems tested at that time.',
        'Benchmark analysis and PPB description; subgroup results (PMLR 81, pp. 77–91)'),
      problem:b('The central problem is that commercial gender classifiers were evaluated mainly by aggregate accuracy, which can hide disparities for intersectional subgroups. The authors do not state formal research questions; their aim is to measure accuracy across gender × skin-type subgroups and to provide a more balanced benchmark. In my assessment, the problem is highly significant because these systems were already commercially available, so disparities could cause real harm. The objectives are specific and measurable: subgroup error rates are a clear outcome, and an audit design is appropriate for obtaining them. The scope is deliberately bounded to binary gender classification, three commercial services and official portraits from six countries. The main weakness in the formulation is the absence of explicit research questions or hypotheses, which makes it harder to judge which analyses were planned in advance.',
        'Introduction; PPB design'),
      litreview:b('The authors situate their work in research on algorithmic bias and on demographic differences in automated face analysis, and they motivate the joint analysis of gender and skin type through intersectionality, a framework originating in Crenshaw’s legal scholarship [10]. They connect this literature to their problem by showing that widely used benchmarks are dominated by lighter-skinned subjects; the gap they claim — no phenotypically balanced, intersectional evaluation of commercial gender classifiers — is therefore supported by their own dataset analysis as well as by prior work. Earlier evidence that face-recognition accuracy varies with demographic attributes [6] is consistent with this framing. The choice of the Fitzpatrick scale over ethnicity labels is well justified. In my assessment, the review is relevant and credible but concise, and it could explain more explicitly how findings about face recognition transfer to the different task of gender classification. Later large-scale work, including NIST’s demographic evaluation [5] and the FairFace dataset [7], confirms that the gap was real, which supports the paper’s claimed originality.',
        'Introduction and related-work discussion; benchmark composition analysis'),
      method:b('This is a quantitative, observational audit study. Testing deployed systems on a controlled benchmark and disaggregating errors by subgroup is appropriate for the aim, because it isolates performance differences without access to the proprietary models. Data consisted of publicly available official portraits of parliamentarians from Rwanda, Senegal, South Africa, Iceland, Finland and Sweden, selected to balance gender and skin type. Each image was labelled for binary gender and for Fitzpatrick skin type, grouped into lighter (types I–III) and darker (types IV–VI). The three services were queried and their outputs compared with these labels to compute error rates and related metrics for each subgroup. The procedure is simple and clearly described, and because PPB was made available, the evaluation is reproducible in principle; however, the commercial services are black boxes that change over time, so the exact numbers cannot be replicated. Several assumptions affect validity. Gender is treated as binary, excluding non-binary people. Collapsing six skin types into two groups may hide variation within each group. Posed, high-quality official portraits of adult professionals differ from real-world images, which limits external validity. Resource requirements are modest, which makes the method accessible to other auditors. Ethically, using public images of public officials reduces privacy risk, although the individuals pictured did not explicitly consent to this use.',
        'Methodology / PPB construction; skin-type labelling'),
      results:b('The key result is that all three classifiers performed worst on darker-skinned females, with error rates of up to 34.7%, compared with at most 0.8% for lighter-skinned males. This intersectional gap is considerably larger than the gap observed for gender or skin type alone, which directly answers the research aim and justifies the intersectional framing. The results were obtained on PPB’s well-lit, frontal portraits, so error rates on unconstrained real-world images could differ. The reported metrics are appropriate and presented transparently by subgroup, making the disparities easy to verify. In my assessment, the authors’ main interpretation — that aggregate metrics conceal subgroup failures — is well supported, and they remain cautious about causes. However, the study does not test why the disparities arise, for example through training-data composition or image-quality factors, so causal explanations remain hypotheses. Generalization is limited to three systems, binary gender classification and a single point in time.',
        'Subgroup results tables; discussion'),
      contribution:b('The paper makes three linked contributions: empirical evidence of large intersectional disparities in commercial systems; a methodological approach, namely disaggregated, phenotype-based evaluation; and a dataset, PPB. Its novelty lies in combining intersectional analysis with skin type rather than race labels and applying it to deployed commercial products. Practically, the findings matter to developers, procurement teams, regulators and affected communities, and disaggregated reporting now appears in documentation practices such as Model Cards [2]. A follow-up study reported that audited vendors reduced these disparities after public disclosure [1]; this is evidence from later work, not a result of this paper. In my assessment, the contribution is well supported for gender classification, but its applicability is limited by binary labels, the specific image domain and the rapid evolution of commercial systems.',
        'Conclusion; later work [1], [2]'),
      strengths:b('First, the paper addresses an important real-world problem: it audits commercial systems that were already in use, rather than research prototypes, which gives its findings immediate practical relevance. Second, the design is simple, transparent and well matched to the aim: disaggregating errors by gender and skin type exposes disparities that aggregate accuracy hides, and the Fitzpatrick scale provides a phenotype-based alternative to unstable ethnicity labels. Third, the evidence is clear and compelling; the contrast between at most 0.8% error for lighter-skinned males and up to 34.7% for darker-skinned females is difficult to dispute. Finally, making PPB available allows other researchers to assess and extend the work, which has supported substantial follow-up research on auditing [1], [3].'),
      weaknesses:b('The first weakness concerns external validity. PPB contains posed, well-lit official portraits of adult parliamentarians, so the reported error rates may not reflect performance on the varied images these systems process in practice. Second, gender is treated as binary, which excludes non-binary and gender-nonconforming people; the audit therefore cannot assess harms to these groups. Third, collapsing six Fitzpatrick types into “lighter” and “darker” may hide important differences within each group, so subgroup estimates are coarse. Fourth, only three systems were evaluated at one point in time, and commercial services are updated without notice, which limits the reproducibility of the exact figures. Finally, the study documents disparities but does not investigate their causes, such as training-data composition, so it offers limited guidance on which technical remedies would be most effective. In my assessment, none of these weaknesses undermines the central conclusion that aggregate accuracy can mask subgroup failures, but they restrict how far the specific numbers can be generalised.'),
      future:b('First, the audit should be repeated on unconstrained real-world images with varied lighting, pose and age, addressing the limited external validity of posed portraits. Second, future work should move beyond binary gender labels, or question whether automated gender classification is appropriate at all, addressing the exclusion of non-binary people. Third, longitudinal re-audits of the same systems would address the single-snapshot limitation and test whether disclosure leads to lasting improvement, as later work began to examine [1]. Fourth, controlled experiments that vary training-data composition would help explain the causes of disparities and identify effective mitigations. Finally, the intersectional audit approach could be extended to generative AI and language technologies, for example by evaluating output quality for Arabic-speaking users, where similar representation gaps may exist.')
    },

async function copyText(text, msg='Copied to clipboard'){
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove();
  }
  toast(msg);
}
// Offer a file: through the viewer's download permission when hosted on claude.ai, else a normal download link
async function saveFile(filename, blob, okMsg){
  const dl = await (window.claude && typeof window.claude.use === 'function' ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : null);
  if (dl){
    try { await dl.save({filename, data:blob}); toast(okMsg); }
    catch (e){ if (e && e.code !== 'declined') toast('This file could not be saved here'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); toast(okMsg);
}

/* ---------- 3. Critique Studio ---------- */
const words = t => ((t||'').trim().match(/\S+/g) || []).length;
const critTitle = c => (c.form === 'aau' ? c.info.title : c.citation.title) || '';
const today = () => new Date().toISOString().slice(0,10);
function newCritique(){ return {id:uid(), form:'general', created:Date.now(), recommendation:'', citation:{authors:'',title:'',year:'',venue:'',doi:''}, sections:{}}; }
function newAau(){
  return {id:uid(), form:'aau', created:Date.now(), paper:null, qc:{}, partA:{}, b:{},
    info:Object.fromEntries(AAU_INFO.map(f => [f.k, f.k === 'date' ? today() : ''])),
    refs:Array.from({length:10}, () => ({text:'', ok:false}))};
}
function fixCrit(c){
  if (c.form === 'aau'){
    c.info ||= {}; c.partA ||= {}; c.b ||= {}; c.qc ||= {};
    c.refs = Array.from({length:10}, (_,i) => (c.refs||[])[i] || {text:'', ok:false});
  } else { c.form = 'general'; c.citation ||= {}; c.sections ||= {}; }
  return c;
}

/* --- shared helpers (both templates) --- */
function critFilled(c, key){
  if (key === 'citation') return !!(c.citation.title||'').trim();
  const s = c.sections[key] || {};
  return !!(s.text||'').trim() && !!s.rating;
}
const aauText = (c, k) => (c.b[k]||{}).text || '';
const evalTotal = c => AAU_8.reduce((a,s) => a + words(aauText(c, s.k)), 0);
function aauUnits(c){
  const i = c.info, e = AAU_8.map(s => words(aauText(c, s.k)));
  return [
    {k:'info', l:'Info', ok:!!(i.title && i.authors && i.venue && i.year)},
    {k:'partA', l:'Part A', ok:AAU_A.every(a => (c.partA[a.k]||{}).score)},
    ...AAU_B.map(s => { const n = words(aauText(c, s.k)); return {k:s.k, l:`${s.no}. ${s.s}`, ok:n > 0 && n <= s.max}; }),
    {k:'refs', l:'7. References', ok:c.refs.filter(r => r.text.trim()).length === 10},
    {k:'eval', l:'8. Evaluation', ok:e.every(n => n > 0) && e.reduce((a,b)=>a+b,0) <= 500}
  ];
}
function critProgress(c){
  if (c.form === 'aau'){ const u = aauUnits(c); return {n:u.filter(x => x.ok).length, total:u.length}; }
  const n = CRIT_SECTIONS.filter(s => critFilled(c, s.key)).length; return {n, total:CRIT_SECTIONS.length};
}
const critDone = c => { const p = critProgress(c); return p.n === p.total; };
function critAvg(c){
  if (c.form === 'aau') return 0;
  const r = CRIT_SECTIONS.filter(s => s.rated !== false).map(s => (c.sections[s.key]||{}).rating).filter(Boolean);
  return r.length ? (r.reduce((a,b)=>a+b,0)/r.length) : 0;
}

function wcLabel(el, n, max, rec){
  if (!el) return;

  el.classList.toggle('over', !rec && n > max);
  el.classList.toggle('ok', !rec && n > 0 && n <= max);
}
function aauQcAuto(c){

  const tot = evalTotal(c); if (tot > 500) over.push('8');
  const filled = c.refs.filter(r => r.text.trim()).length, ver = c.refs.filter(r => r.text.trim() && r.ok).length;
  const missing = units.filter(u => !u.ok).map(u => u.l);
  return [
    {ok:!missing.length, m:missing.length ? 'Still to complete: ' + missing.join(', ') : 'All sections addressed'},
    {ok:!over.length, m:over.length ? 'Over the limit: section ' + over.join(', ') : 'Every section is within its limit'},
    {ok:tot > 0 && tot <= 500, m:`8(a) + 8(b) + 8(c) = ${tot} / 500 words`},

}

  const wr = $('#wc-refs'); wr.textContent = `${rn}/10 entered · ${rv} verified`; wr.classList.toggle('ok', rn === 10 && rv === 10);

// pdf.js 3.11.174: the copy shipped next to this page (vendor/pdfjs/) first, then the CDN
const PDFJS_SRC = ['vendor/pdfjs/', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/'];
let pdfjsP;
function loadPdfJs(){
  const tryAt = i => new Promise((res, rej) => {
    if (i >= PDFJS_SRC.length) return rej(new Error('The PDF reader could not be loaded — check your internet connection.'));
    const s = document.createElement('script'); s.src = PDFJS_SRC[i] + 'pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_SRC[i] + 'pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror = () => { s.remove(); tryAt(i + 1).then(res, rej); };
    document.head.appendChild(s);
  });
  return pdfjsP ||= tryAt(0).catch(e => { pdfjsP = null; throw e; });
}
async function extractPdf(file){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages = [];
  for (let n = 1; n <= doc.numPages; n++){
    const tc = await (await doc.getPage(n)).getTextContent();
    pages.push(tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g,' ').replace(/-\n(?=[a-z])/g,'').trim());
  }
  return pages;
}

function genSummary(c){
  const ci = c.citation, avg = critAvg(c);
  const ref = [ci.authors, ci.year && `(${ci.year})`].filter(Boolean).join(' ') + (ci.title ? `. "${ci.title}."` : '') + (ci.venue ? ` ${ci.venue}.` : '') + (ci.doi ? ` ${ci.doi}` : '');

  L.push('='.repeat(48));
  L.push(ci.title || 'Untitled paper');
  if (ref.trim()) L.push(ref.trim());
  L.push('');
  L.push(`Overall rating: ${avg ? avg.toFixed(1) + ' / 5' : 'not yet rated'}` + (c.recommendation ? `   |   Recommendation: ${c.recommendation}` : ''));
  L.push(`Sections completed: ${critProgress(c).n} / ${CRIT_SECTIONS.length}`);
  for (const s of CRIT_SECTIONS){
    const st = c.sections[s.key] || {};
    if (s.key === 'citation' && !(st.text||'').trim()) continue;
    L.push('');
    L.push(`${s.title.toUpperCase()}${st.rating ? `  [${st.rating}/5 – ${RATING_LABELS[st.rating]}]` : ''}`);
    L.push('-'.repeat(Math.min(48, s.title.length + 14)));
    L.push((st.text||'').trim() || '(not yet written)');
  }
  const rated = CRIT_SECTIONS.filter(s => (c.sections[s.key]||{}).rating);
  if (rated.length >= 2){
    const sorted = [...rated].sort((a,b) => c.sections[b.key].rating - c.sections[a.key].rating);
    L.push('');
    L.push('AT A GLANCE');
    L.push('-'.repeat(20));
    const strong = sorted.filter(s => c.sections[s.key].rating >= 4).map(s => s.title);
    L.push('Strongest: ' + (strong.length ? strong.join(', ') : '—'));
    const weak = sorted.filter(s => c.sections[s.key].rating <= 3).map(s => s.title);
    L.push('Needs work: ' + (weak.length ? weak.join(', ') : '—'));
  }
  return L.join('\n');
}

/* --- PDF → paragraphs (uses item positions to find breaks, headings and repeated headers) --- */
// One page of a PDF as text lines with positions (PDF units, y grows upwards)
async function pdfPageLines(page){
  const tc = await page.getTextContent(), ph = (page.view && page.view[3]) || 842, pw = (page.view && page.view[2]) || 595;
  const lines = []; let cur = null;
  for (const it of tc.items){
    if (!('str' in it)) continue;
    const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 10;
    if (cur && Math.abs(y - cur.y) < h * 0.6 && x >= cur.xEnd - h * 0.5 && x - cur.xEnd < h * 1.2){   // same line, same column
      const gap = x - cur.xEnd;
      if (gap > h * 0.15 && !/\s$/.test(cur.text) && !/^\s/.test(it.str)) cur.text += ' ';
      cur.text += it.str; cur.xEnd = Math.max(cur.xEnd, x + (it.width || 0));
    } else if (it.str.trim()){
      if (cur) lines.push(cur);
      cur = {text:it.str, x, y, h, xEnd:x + (it.width || 0)};
    }
    if (it.hasEOL && cur){ lines.push(cur); cur = null; }
  }
  if (cur) lines.push(cur);
  lines.forEach(l => { l.text = l.text.replace(/\s+/g, ' ').trim(); l.w = l.xEnd - l.x; });
  const byY = lines.filter(l => l.text).sort((a,b) => b.y - a.y);      // only the outermost lines can be headers / footers
  [...byY.slice(0, 2), ...byY.slice(-2)].forEach(l => { l.edge = l.y > ph * 0.9 || l.y < ph * 0.1; });
  return {lines:lines.filter(l => l.text), W:pw, H:ph};
}
async function pdfToParagraphs(file){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages = [], pageLines = [];
  for (let n = 1; n <= doc.numPages; n++){
    const {lines:keep} = await pdfPageLines(await doc.getPage(n));
    pageLines.push(keep);
    pages.push(keep.map(l => l.text).join('\n'));
  }
  // running headers / footers / page numbers: identical short lines on 3+ pages
  const freq = {};
  pageLines.forEach(ls => new Set(ls.map(l => l.text.replace(/\d+/g,'#'))).forEach(t => freq[t] = (freq[t]||0) + 1));
  const noise = l => /^\d{1,4}$/.test(l.text) || (pageLines.length >= 2 && l.edge && l.text.length < 120 && freq[l.text.replace(/\d+/g,'#')] >= Math.min(3, pageLines.length));

  const paras = []; let section = 'Title & authors', buf = [], bufPage = 1, inRefs = false, seq = 0;
  const flush = (kind) => {
    if (!buf.length) return;
    let text = '';
    buf.forEach(t => { text = /[a-z]-$/.test(text) && /^[a-z]/.test(t) ? text.slice(0,-1) + t : (text ? text + ' ' + t : t); });
    text = text.replace(/\s+/g,' ').trim();
    if (text) paras.push({id:'p' + (++seq), section, page:bufPage, kind:kind || (/^(fig\.?|figure|table)\s*[\dIVX]+/i.test(text) ? 'caption' : section === 'Title & authors' ? 'front' : 'text'), text, idea:'', src:'', terms:[], mine:'', link:{to:'', rel:''}});
    buf = [];
  };
  let prev = null;
  pageLines.forEach((ls, pi) => {
    const widths = ls.map(l => l.w).filter(w => w > 0).sort((a,b) => a-b);
    const typical = widths[Math.floor(widths.length * 0.75)] || 300;
    let newPage = true;
    for (const l of ls){
      if (inRefs) break;
      if (noise(l)) continue;
      const t = l.text;
      const shortLine = t.length < 80 && !/[.,;]$/.test(t);
      if (REF_RE.test(t)){ flush(); inRefs = true; break; }
      const abs = t.match(/^abstract\s*[—–:\-.]\s*(.+)$/i);
      if (abs){ flush(); section = 'Abstract'; buf = [abs[1]]; bufPage = pi + 1; prev = l; continue; }
      if (shortLine && (HEAD_RE.test(t) && t.split(' ').length <= 8 || NUM_HEAD_RE.test(t) && t.split(' ').length <= 10)){
        flush(); section = t.replace(/^(?:(?:\d+(?:\.\d+)*|[IVX]+)\.?\s+)/, '').replace(/\s+/g,' ');
        section = section.charAt(0).toUpperCase() + section.slice(1).toLowerCase();
        prev = null; continue;
      }
      let brk = !prev;
      if (prev){
        const dy = prev.y - l.y, sentenceEnd = /[.?!:"”]$/.test(prev.text);
        if (newPage || dy < -l.h) brk = sentenceEnd && !/^[a-z]/.test(t);                     // new page or column: keep a running sentence together
        else if (dy > Math.max(prev.h, l.h) * 1.8) brk = true;                               // big vertical gap
        else if (l.x > prev.x + l.h * 0.8 && /[.?!:"”]$/.test(prev.text)) brk = true;        // first-line indent
        else if (prev.w < typical * 0.7 && /[.?!:"”]$/.test(prev.text)) brk = true;          // short last line of a paragraph
      }
      if (brk && buf.length) flush();
      if (!buf.length) bufPage = pi + 1;
      buf.push(t); prev = l; newPage = false;
    }
  });
  flush();
  // merge fragments (< 25 words) into the next paragraph of the same section
  for (let i = paras.length - 2; i >= 0; i--){
    const a = paras[i], b = paras[i+1];
    if (a.kind === 'text' && b.kind === 'text' && a.section === b.section && words(a.text) < 25){ b.text = a.text + ' ' + b.text; b.page = a.page; paras.splice(i, 1); }
  }
  return {pages, paras, seq};
}

Content (id, section, page, main idea or text):
${body.slice(0, 150000)}

function chatContext(paper, scope){
  const rules = `You are a patient tutor helping a master's student understand a research paper. Answer in clear, simple English (or in Arabic if the student writes in Arabic or asks for Arabic). Keep answers short — under 150 words, using short paragraphs or bullet points — unless the student asks for more.

  }

}
async function chatSend(scope, text){
  const paper = rPaper(); text = (text || '').trim();
  if (!paper || !text || chatRun) return;
  if (!aiReady()) return toast('Asking Claude works on the published ScholarPath page on claude.ai');
  const msgs = chatOf(paper, scope);
  msgs.push({role:'user', content:text}); save();
  rerenderChat(paper, scope);
  const live = $('#chat-live-' + scope); if (live){ live.hidden = false; live.innerHTML = '<p class="muted"><span class="spin" aria-hidden="true"></span> Thinking…</p>'; live.scrollIntoView({block:'nearest'}); }
  const ctl = new AbortController(); chatRun = {ctl, scope};
  setChatBusy(scope, true);
  const turns = [{role:'user', content:chatContext(paper, scope)}, ...msgs.slice(-12)];
  try {
    const {text:answer, truncated} = await AI(turns, {signal:ctl.signal, cache:false, onText:({text}) => { const el = $('#chat-live-' + scope); if (el){ el.hidden = false; el.innerHTML = mdLite(text); } }});
    msgs.push({role:'assistant', content:answer + (truncated ? '\n\n(Answer cut short — ask for a shorter answer or a specific part.)' : '')});
  } catch (e){
    if (e && e.text) msgs.push({role:'assistant', content:e.text + '\n\n(Interrupted.)'});
    else if (!e || e.code !== 'cancelled') msgs.push({role:'assistant', content:'⚠ ' + aiError(e)});
    else msgs.pop();
  } finally {
    chatRun = null; save(); rerenderChat(paper, scope); setChatBusy(scope, false);

}

const lcFirst = s => s && /^(the|this|these|that|those|a|an|all|both|each|every|most|many|some|it|its|there|their|our|we|they|accuracy|performance|students|participants|results?)\b/i.test(s) && !/^[A-Z]{2,}/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s;

function phraseList(text, noun){
  return (text || '').split('\n').map(l => trimDot(l.replace(/^[-•*]\s*/, '').replace(new RegExp(`^(the (${noun}|figure|table)|it)\\s+`, 'i'), '')))

}

  else if (r.support) L.push({full:'It fully supports the related claim in the text.', partial:'It only partially supports the related claim in the text.', none:'It does not support the related claim in the text.'}[r.support]);
  if (r.supportWhy.trim()) L.push(trimDot(r.supportWhy) + '.');
  ['relation', 'importance', 'effect'].forEach(k => { if ((r[k] || '').trim()) L.push(trimDot(r[k]) + '.'); });
  const noun = t && t.k === 'table' ? 'table' : 'figure';

  return L.join(' ');
}

async function renderRegion(doc, pageNo, reg){

function applyFigAnalysis(r, res, sawImage){

  if (FIG_TYPES.some(t => t.k === res.type)) r.type = res.type;
  ['x','y','single','pattern','claim','supportWhy','importance','effect','relation'].forEach(k => { r[k] = str(res[k]); });
  if (['full','partial','none'].includes(res.support)) r.support = res.support;
  r.strengths = list(res.strengths); r.weaknesses = list(res.weaknesses);
  const ch = res.checks || {};
  FIG_CHECKS.forEach(([k]) => {
    const v = ch[k];
    r.checks[k] = !sawImage && VISUAL_CHECKS.includes(k) ? 'na' : v === true || v === 'true' ? true : /^n\/?a$/i.test(String(v)) ? 'na' : false;
  });
  FIG_RATINGS.forEach(([k]) => { const n = Math.round(Number((res.ratings || {})[k])); if (n >= 1 && n <= 5) r.ratings[k] = n; });
  r.flags = {}; r.ai = {at:Date.now(), image:sawImage};
}
async function analyseOne(r, blobs, signal){
  let lim = null; try { lim = AI.limits ? await AI.limits() : null; } catch {}
  const max = lim && lim.images ? lim.images.maxCount : 0;
  const imgs = max ? blobs.filter(Boolean).slice(0, max) : [];
  const opts = {signal, modelTier:'default'};
  if (imgs.length) opts.images = imgs;
  let res;
  try { res = await AI.json(figPrompt(r, imgs.length), opts); }
  catch (e){
    if (e && (e.code === 'images_unavailable' || e.code === 'image_rejected') && imgs.length){ delete opts.images; res = await AI.json(figPrompt(r, 0), opts); applyFigAnalysis(r, res, false); return; }
    throw e;
  }
  applyFigAnalysis(r, res, imgs.length > 0);
}
async function figRunItems(selected, analyse){
  const critId = S.figlab.scanCrit || '', ctl = new AbortController(), done = [];

  try {
    for (const it of selected){
      if (ctl.signal.aborted) break;

      let blobs = [];

      save();

}

/* ---------- 5. Presentation Builder ---------- */
function presSources(){
  return [
    ...S.critiques.map(c => ({id:'crit:'+c.id, label:`Critique: ${c.example?'[Example] ':''}${c.form==='aau'?'AAU · ':''}${clip(critTitle(c)||'Untitled',60)}${critDone(c)?' ✓':''}`})),
    {id:'paper', label:`My paper outline: ${clip(S.writing.title||'Untitled', 60)}`}
  ];
}
function figBullets(c){
  const figs = S.figlab.reviews.filter(r => r.critId === c.id && (r.figNo || r.pattern));
  return figs.slice(0, 2).map(r => `Show ${r.figNo || 'figure'}: ${clip(trimDot(r.pattern) || r.caption || '', 90)}`);
}
function bullets(text, n=3, fallback){
  const s = sentences(text).slice(0, n).map(x => clip(x, 160));
  return s.length ? s : [fallback];
}
function buildSlides(){
  const src = S.pres.source || '';
  if (src.startsWith('crit:')){
    const c = S.critiques.find(x => 'crit:'+x.id === src);
    if (c && c.form === 'aau'){
      const t = k => aauText(c, k), i = c.info;
      const need = l => `[Add your ${l} in the Critique Studio]`;
      return {
        title:{h:i.title||'Paper title', b:[[i.authors, i.year].filter(Boolean).join(', ') || 'Authors, year', i.venue || 'Venue', `Critique by: ${i.studentName || '[your name]'}${i.presNo ? ` · Presentation ${i.presNo}` : ''}`]},
        background:{b:bullets(t('summary'), 2, need('summary'))},
        problem:{b:[...bullets(t('problem'), 2, need('research problem & objectives')), ...bullets(t('litreview'), 1, need('literature review'))]},
        method:{b:bullets(t('method'), 3, need('methodology critique'))},
        findings:{b:[...bullets(t('results'), 3, need('results & discussion')), ...figBullets(c)]},
        critique:{b:[...bullets(t('strengths'), 2, need('strengths')).map(x => 'Strength: ' + x), ...bullets(t('weaknesses'), 2, need('weaknesses')).map(x => 'Weakness: ' + x)]},
        conclusion:{b:[...bullets(t('contribution'), 2, need('contribution')), ...bullets(t('future'), 1, need('future work')).map(x => 'Future work: ' + x),
          ...(AAU_A.some(a => (c.partA[a.k]||{}).score) ? ['Diagnostic ratings: ' + AAU_A.filter(a => (c.partA[a.k]||{}).score).map(a => `${a.t} ${c.partA[a.k].score}/${a.max}`).join(' · ')] : [])]},
        qa:{b:['Thank you — questions?','Prepare: How far do the findings generalise beyond this setting?','Prepare: Which of the weaknesses matters most, and why?']}
      };
    }
    if (c){
      const sec = k => (c.sections[k]||{}).text || '';
      const r = k => (c.sections[k]||{}).rating;
      const ph = k => `[Add your ${CRIT_SECTIONS.find(s=>s.key===k).title.toLowerCase()} notes in the Critique Studio]`;
      const rated = CRIT_SECTIONS.filter(s => r(s.key) && s.key!=='verdict');
      const strengths = rated.filter(s => r(s.key) >= 4).map(s => `${s.title} (${r(s.key)}/5)`);
      const weaknesses = rated.filter(s => r(s.key) <= 3).map(s => `${s.title} (${r(s.key)}/5)`);
      const ci = c.citation;
      return {
        title:{h:ci.title||'Paper title', b:[[ci.authors, ci.year].filter(Boolean).join(', ') || 'Authors, year', ci.venue || 'Venue', 'A critical review by: [your name]']},
        background:{b:bullets(sec('citation') || sec('problem'), 2, ph('problem'))},
        problem:{b:[...bullets(sec('problem'), 2, ph('problem')), ...bullets(sec('objectives'), 1, ph('objectives'))]},
        method:{b:[...bullets(sec('methodology'), 2, ph('methodology')), ...bullets(sec('dataset'), 1, ph('dataset'))]},
        findings:{b:[...bullets(sec('results'), 3, ph('results')), ...figBullets(c)]},
        critique:{b:[
          'Strengths: ' + (strengths.join(', ') || 'rate sections 4–5 to list them'),
          'Weaknesses: ' + (weaknesses.join(', ') || 'rate sections 1–3 to list them'),
          ...bullets(sec('limitations'), 1, ph('limitations')),
          ...(sec('ethics') ? bullets(sec('ethics'), 1, '') : [])
        ]},
        conclusion:{b:[...bullets(sec('verdict'), 2, ph('verdict')), ...bullets(sec('contribution'), 1, ph('contribution')),
          ...(c.recommendation ? [`Recommendation: ${c.recommendation}${critAvg(c) ? ` — overall ${critAvg(c).toFixed(1)}/5` : ''}`] : [])]},
        qa:{b:['Thank you — questions?','Prepare: Would the results hold with a different sample?','Prepare: How could this study be improved or extended?']}
      };
    }
  }
  const n = k => stepState(k).notes;
  const ph = k => `[Add notes to "${WRITE_STEPS.find(s=>s.key===k).title}" in Write Your Paper]`;
  return {
    title:{h:S.writing.title||'Your paper title', b:['[Your name], [Institution]','[Course / conference], [date]']},
    background:{b:bullets(n('topic') + ' ' + n('litreview'), 3, ph('litreview'))},
    problem:{b:[...bullets(n('gap'), 2, ph('gap')), ...bullets(n('question'), 1, ph('question'))]},
    method:{b:bullets(n('methodology'), 3, ph('methodology'))},
    findings:{b:bullets(n('results'), 3, ph('results'))},
    critique:{h:'Strengths & limitations of my study', b:bullets(n('discussion'), 3, ph('discussion'))},
    conclusion:{b:bullets(n('conclusion') || n('abstract'), 3, ph('conclusion'))},
    qa:{b:['Thank you — questions?','Contact: [email]','Prepare: What would you do differently with more time?']}
  };
}
const fmtTime = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
function slidePlan(){
  const sl = buildSlides(), total = S.pres.minutes * 60;
  let cum = 0;
  return SLIDES.map((d,i) => { const secs = Math.round(total*d.w/5)*5; const start = cum; cum += secs; return {...d, n:i+1, secs, start, h:sl[d.key].h, b:sl[d.key].b.filter(Boolean)}; });
}
function presOutline(plan){
  const src = presSources().find(s => s.id === S.pres.source);
  const L = [`PRESENTATION OUTLINE — ${S.pres.minutes}-minute talk`, `Source: ${src ? src.label : ''}`, '='.repeat(48), ''];
  plan.forEach(s => {
    L.push(`SLIDE ${s.n}: ${s.title}${s.h ? ` — ${s.h}` : ''}   [${fmtTime(s.secs)} · starts at ${fmtTime(s.start)}]`);
    s.b.forEach(b => L.push(`  • ${b}`));
    L.push(`  Speaker notes: ${s.tip}`);
    L.push('');
  });
  L.push('Timing tip: ' + TALK_GUIDE[S.pres.minutes]);
  return L.join('\n');
}

  <div class="output" id="presOut">${esc(presOutline(plan))}</div></div>`;

    <div class="card"><h3>Ideas by status</h3>

    </div>
    <div class="card"><h3>Critiques</h3>
      ${S.critiques.length ? S.critiques.map(c => { const p = critProgress(c); return `<div class="bar-row" style="grid-template-columns:1fr 90px 44px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(critTitle(c))}">${esc(critTitle(c)||'Untitled')}${c.example?' <span class="badge-example">Ex</span>':''}</span><span class="bar"><span style="width:${p.n/p.total*100}%;background:var(--accent)"></span></span><b>${p.n}/${p.total}</b></div>`; }).join('') : '<p class="muted">No critiques yet.</p>'}
    </div>
  </div>

  <div class="card" style="margin-top:16px"><h3>Writing path</h3>
    <div class="steps-mini">${WRITE_STEPS.map((s,i) => `<div class="step-mini ${stepDone(s)?'done':''}"><span class="step-dot">${stepDone(s)?icon('check'):i+1}</span>${s.title}</div>`).join('')}</div>
  </div>

  <div class="card" style="margin-top:16px"><h3>Paper Reader</h3>
    ${S.reader.papers.length ? S.reader.papers.map(p => { const t = p.paras.filter(x => x.kind !== 'front'), d = t.filter(x => (x.idea||'').trim()).length; return `<div class="bar-row" style="grid-template-columns:1fr 90px 60px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.title || p.name)}${p.example?' <span class="badge-example">Demo</span>':''}</span><span class="bar"><span style="width:${t.length ? d/t.length*100 : 0}%;background:var(--ok)"></span></span><b>${d}/${t.length} ¶</b></div>`; }).join('') : '<p class="muted">No papers read yet.</p>'}
  </div>

  <div class="section-title"><h2>Your data</h2></div>
  <div class="card">
    <p class="muted" style="margin-top:0">Everything is stored privately in this browser. Download a backup to move your work to another device or keep it safe.</p>
    <div class="row">
      <button class="btn primary" data-act="export">${icon('download')}Back up (JSON)</button>
      <label class="btn" for="importFile" style="cursor:pointer">${icon('upload')}Restore backup</label>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      ${examples ? `<button class="btn" data-act="clear-examples">${icon('x')}Remove examples</button>` : `<button class="btn" data-act="add-examples">${icon('sparkle')}Add examples back</button>`}
      <button class="btn danger" data-act="reset">${icon('trash')}Reset everything</button>
    </div>
  </div>`;
};

document.addEventListener('click', e => {

  if (e.target.classList.contains('tab') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')){
    const i = TABS.findIndex(t => t.id === S.ui.tab), n = TABS[(i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length];

  }
});

  else if (t.dataset.ai){ const cc = c(); cc.info[t.dataset.ai] = t.value; save(); updateAau();
    if (t.dataset.ai === 'title'){ const o = $('#critSel option:checked'); if (o) o.innerHTML = critOptLabel(cc); } }
  else if (t.dataset.ab){ (c().b[t.dataset.ab] ||= {}).text = t.value; save(); updateAau(); grow(t); }
  else if (t.dataset.aev){ (c().b[t.dataset.aev] ||= {}).ev = t.value; save(); }
  else if (t.dataset.an){ (c().partA[t.dataset.an] ||= {}).note = t.value; save(); }
  else if (t.dataset.ref){ c().refs[+t.dataset.ref].text = t.value; save(); updateAau(); }
  else if (t.id === 'evq'){ evidenceSearch(t.value); }
  else if (t.dataset.crit){ const s = c().sections[t.dataset.crit] ||= {}; s.text = t.value; save(); updateCritChrome(); }
  else if (t.dataset.cite){ c().citation[t.dataset.cite] = t.value; save(); updateCritChrome();
    if (t.dataset.cite === 'title'){ const o = $('#critSel option:checked'); if (o) o.innerHTML = critOptLabel(c()); } }
  else if (t.dataset.wnotes){ stepState(t.dataset.wnotes).notes = t.value; save(); const o = $('#outlineOut'); if (o) o.textContent = paperOutline(); }
  else if (t.id === 'wTitle'){ S.writing.title = t.value; save(); const o = $('#outlineOut'); if (o) o.textContent = paperOutline(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.fl === 'critId'){ RENDER.figlab(); return; }
  if (t.id === 'flScanCrit'){ S.figlab.scanCrit = t.value; save(); RENDER.figlab(); return; }
  if (t.dataset.fsel !== undefined){ figScan.items[+t.dataset.fsel].sel = t.checked; const n = figScan.items.filter(i => i.sel).length;
    $$('[data-act="fl-scan-go"]').forEach(b => { b.disabled = !n; b.innerHTML = b.dataset.v === 'ai' ? `${icon('sparkle')}Analyse ${n} with Claude` : `${icon('plus')}${aiReady() ? 'Only create reviews' : `Create ${n} review${n === 1 ? '' : 's'}`}`; }); return; }
  if (t.id === 'flPdf' && t.files[0]){
    const file = t.files[0]; t.value = ''; toast('Looking for figures and tables…');
    scanFigures(file).then(sc => {
      figScan = sc;
      figScan.items.forEach(it => { it.sel = !S.figlab.reviews.some(r => r.critId === (S.figlab.scanCrit || '') && normFig(r.figNo) === normFig(it.label) && r.ai); });
      RENDER.figlab(); toast(`${sc.items.length} figure${sc.items.length === 1 ? '' : 's'} and table${sc.items.length === 1 ? '' : 's'} found`);
    }).catch(err => alert('Could not read this PDF. ' + (err && err.message || '')));
    return;
  }
  if (t.id === 'flFilter'){ S.figlab.filter = t.value; const vis = S.figlab.reviews.filter(r => !t.value || r.critId === t.value); if (vis.length && !vis.includes(activeFig())) S.figlab.active = vis[0].id; save(); RENDER.figlab(); return; }
  if (t.dataset.flc){ const r = activeFig(); r.checks[t.dataset.flc] = t.checked; t.closest('.check').classList.toggle('on', t.checked); save(); updateExplain(); return; }
  if (t.dataset.flr !== undefined){ const r = activeFig(); r.flags[+t.dataset.flr] = t.checked; t.closest('.check').classList.toggle('on-flag', t.checked); save(); updateExplain(); return; }
  if (t.dataset.rp === 'rel' || t.dataset.rp === 'to'){
    const para = rPaper().paras.find(x => x.id === t.dataset.id); if (!para) return;
    para.link[t.dataset.rp] = t.value;
    if (t.dataset.rp === 'to' && t.value && !para.link.rel) para.link.rel = 'supports';
    if (t.dataset.rp === 'to' && !t.value) para.link.rel = '';
    save(); refreshCards([para]); return;
  }
  if (t.id === 'rpSel'){ if (TTS.playing) ttsPause(); chatOpen = null; S.reader.active = t.value; save(); RENDER.reader(); return; }
  if (t.id === 'ttsRate'){ S.reader.rate = +t.value; save(); if (TTS.playing){ ttsHalt(); ttsSpeak(false); } return; }
  if (t.id === 'ttsVoiceEn' || t.id === 'ttsVoiceAr'){ S.reader[t.id === 'ttsVoiceEn' ? 'voiceEn' : 'voiceAr'] = t.value; save(); if (TTS.playing){ ttsHalt(); ttsSpeak(false); } else renderTtsBar(); return; }
  if (t.id === 'rpFile' && t.files[0]){
    const file = t.files[0]; t.value = ''; toast('Reading the paper…');
    pdfToParagraphs(file).then(res => {
      if (!res.paras.length){ alert('No text could be found — the PDF may be a scanned image. Try “Paste text” instead.'); return; }
      const name = file.name.replace(/\.pdf$/i, '');
      addReaderPaper(file.name, name, res);
    }).catch(err => alert('Could not read this PDF. ' + (err && err.message || '')));
    return;
  }
  if (t.id === 'dbSel'){ S.ui.db = t.value; save(); if ($('#q').value.trim()) buildSearch(); }
  else if (t.id === 'tagSel'){ S.ui.tag = t.value; save(); RENDER.ideas(); }
  else if (t.id === 'paperIdeaSel'){ S.ui.paperIdea = t.value; save(); RENDER.ideas(); }
  else if (t.dataset.change === 'idea-status'){ const i = findIdea(t.dataset.id); if (i){ i.status = t.value; save(); RENDER.ideas(); toast(`Moved to ${t.value}`); } }
  else if (t.id === 'critSel'){ S.activeCrit = t.value; save(); RENDER.critique(); }
  else if (t.dataset.arev){ (activeCrit().b[t.dataset.arev] ||= {}).rev = t.checked; save(); }
  else if (t.dataset.refok !== undefined){ activeCrit().refs[+t.dataset.refok].ok = t.checked; save(); updateAau(); }
  else if (t.dataset.qc !== undefined){ activeCrit().qc[+t.dataset.qc] = t.checked; t.closest('.check').classList.toggle('on', t.checked); save(); updateAau(); }
  else if (t.id === 'pdfFile' && t.files[0]){
    const file = t.files[0], c = activeCrit(); t.value = '';
    toast('Reading the paper…');
    extractPdf(file).then(pages => {
      if (!pages.join('').trim()) { alert('No text could be extracted — the PDF may be a scanned image. Try a text-based PDF.'); return; }
      c.paper = {name:file.name, pages}; save(); RENDER.critique(); toast(`Paper loaded: ${pages.length} pages`); $('#evq')?.focus();
    }).catch(err => alert('Could not read this PDF. ' + (err && err.message || '')));
  }
  else if (t.dataset.change === 'crit-rec'){ activeCrit().recommendation = t.value; save(); }
  else if (t.dataset.wcheck !== undefined){
    const st = WRITE_STEPS[S.writing.active|0], ws = stepState(st.key);
    ws.checks[+t.dataset.wcheck] = t.checked; save();
    t.closest('.check').classList.toggle('on', t.checked);
    $('#stepper').innerHTML = stepperHTML(S.writing.active|0);
    const d = WRITE_STEPS.filter(stepDone).length; $('#wDoneN').textContent = d; $('#wBar').style.width = (d/WRITE_STEPS.length*100)+'%';
    $('#outlineOut').textContent = paperOutline();
    if (stepDone(st) && t.checked) toast(`Step complete: ${st.title}`);
  }
  else if (t.dataset.review !== undefined){
    S.writing.review[+t.dataset.review] = t.checked; save();
    t.closest('.check').classList.toggle('on', t.checked);
    const n = SELF_REVIEW.filter((_,i) => S.writing.review[i]).length;
    $('#revN').textContent = n; $('#revMsg').textContent = n === SELF_REVIEW.length ? '✓ Ready to submit — good luck!' : 'Tick every item before you press submit.';
  }
  else if (t.id === 'presSrc'){ S.pres.source = t.value; save(); RENDER.present(); }
  else if (t.id === 'importFile' && t.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.ideas) || !Array.isArray(d.papers) || !Array.isArray(d.critiques)) throw new Error('bad');
        if (!confirm('Replace your current ScholarPath data with this backup?')) return;
        S = Object.assign(seedState(), d); S.ui = Object.assign(seedState().ui, d.ui, {tab:'progress'});
        S.writing = Object.assign(seedState().writing, d.writing); S.pres = Object.assign(seedState().pres, d.pres); S.reader = Object.assign({papers:[], active:'', view:'paras'}, d.reader); S.figlab = Object.assign(seedState().figlab, d.figlab);
        save(); applyTheme(); showTab('progress'); toast('Backup restored');
      } catch { alert('That file is not a valid ScholarPath backup.'); }
    };
    r.readAsText(t.files[0]); t.value = '';
  }
});
window.addEventListener('hashchange', () => showTab(location.hash.slice(1), false));

/* ---------- Boot ---------- */
$('.brand-mark').innerHTML = icon('cap');
S.critiques.forEach(fixCrit);
applyTheme();
showTab(location.hash.slice(1) || S.ui.tab || 'hub');
})();
</script>
</body>
